<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realtime Learning Pack | Ava Word Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6ee; --card:#ffffff; --ink:#3a3f3c; --muted:#8a9089; --border:#ece4d3;
    --mist:#7fa5c4; --mist-light:#e7eff6; --mist-dark:#4d7699;
    --sage:#8fae8f; --sage-light:#ecf3ea; --sage-dark:#5c7d5c;
    --lav:#a595c4; --lav-light:#f0ecf7; --lav-dark:#6e5b91;
    --peach:#e3a97e; --peach-light:#faeee0; --peach-dark:#a56a3b;
    --gold:#d9a441; --gold-glow:rgba(217,164,65,0.35);
    --shadow-sm: 0 2px 8px rgba(58,63,60,0.06);
    --shadow-md: 0 18px 46px rgba(45,40,30,0.16), 0 4px 14px rgba(58,63,60,0.08);
    --radius-lg: 26px; --radius-md: 16px;
    --font-display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --font-body:"Plus Jakarta Sans","Avenir Next","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --theater-1:#16261f; --theater-2:#1f352c; --marquee:#f0ca85; --marquee-deep:#c99a4f; --cream-text:#f4ecd8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 50% -8%, rgba(240,202,133,0.20), transparent 46%),
      radial-gradient(circle at 10% 85%, rgba(111,165,196,0.14), transparent 42%),
      radial-gradient(circle at 90% 90%, rgba(143,174,143,0.12), transparent 46%),
      linear-gradient(180deg, var(--theater-2) 0%, var(--theater-1) 70%);
    color:var(--cream-text); font-family:var(--font-body); line-height:1.6; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .app-shell{max-width:820px;margin:0 auto;padding:0 22px 34px;min-height:100vh;display:flex;flex-direction:column;}
  header{padding:26px 0 8px;display:flex;justify-content:space-between;align-items:center;}
  header h1{font-family:var(--font-display);font-size:22px;color:var(--marquee);margin:0;font-weight:600;}
  header .subtitle{font-size:12.5px;color:rgba(244,236,216,0.55);}
  header .home-link{font-size:13px;color:rgba(244,236,216,0.4);text-decoration:none;}
  header .home-link:hover{color:var(--marquee);}
  main{flex:1;padding-top:14px;}
  .card{
    background:linear-gradient(150deg, #fffdf6 0%, #fbf3e2 100%);
    border:1px solid rgba(255,246,211,0.55);border-radius:var(--radius-lg);
    box-shadow:0 30px 70px rgba(6,16,13,0.45), 0 8px 20px rgba(6,16,13,0.25), 0 0 0 5px rgba(255,255,255,0.28) inset;
    padding:36px 36px 32px;width:100%;position:relative;
  }
  h2{font-family:var(--font-display);font-size:24px;margin:0 0 12px;color:var(--ink);font-weight:600;}
  h3{font-family:var(--font-display);font-size:18px;margin:0 0 8px;color:var(--ink);font-weight:600;}
  .lead{font-size:16px;color:var(--ink);}
  .subhead{font-size:14px;color:var(--muted);margin:0 0 18px;}

  /* ---- Step Indicator ---- */
  .step-track{display:flex;gap:4px;margin-bottom:28px;flex-wrap:wrap;}
  .step-dot{
    flex:1;min-width:80px;text-align:center;padding:10px 6px;border-radius:12px;
    font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    background:rgba(255,246,211,0.12);color:rgba(244,236,216,0.4);
    transition:all .3s ease;cursor:pointer;border:1px solid transparent;
  }
  .step-dot .step-num{display:block;font-size:20px;margin-bottom:2px;font-family:var(--font-display);}
  .step-dot.active{
    background:linear-gradient(180deg, rgba(240,202,133,0.25), rgba(201,154,79,0.15));
    border-color:rgba(240,202,133,0.4);color:var(--marquee);
  }
  .step-dot.done{
    background:rgba(143,174,143,0.15);border-color:rgba(143,174,143,0.3);color:rgba(143,174,143,0.9);
  }

  /* ---- Cold Read ---- */
  .cold-read-text{font-size:19px;line-height:2.2;color:var(--ink);font-family:var(--font-display);}
  .cr-token{cursor:pointer;padding:3px 4px;border-radius:6px;transition:all .15s ease;display:inline;}
  .cr-token:hover{background:var(--mist-light);}
  .cr-token.cr-accurate{border-bottom:3px solid var(--sage);}
  .cr-token.cr-slow{border-bottom:3px solid var(--gold);}
  .cr-token.cr-misread{border-bottom:3px solid var(--peach-dark);}
  .cr-token.cr-unknown-meaning{border-bottom:3px solid var(--lav);}
  .cr-marking-toolbar{
    display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;align-items:center;
    padding:16px;background:var(--mist-light);border-radius:14px;
  }
  .cr-marking-toolbar .label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mist-dark);margin-right:4px;}
  .cr-mark-btn{
    padding:8px 14px;border-radius:10px;border:2px solid transparent;background:#fff;
    font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .15s ease;
  }
  .cr-mark-btn.cr-accurate{border-color:var(--sage);}
  .cr-mark-btn.cr-slow{border-color:var(--gold);}
  .cr-mark-btn.cr-misread{border-color:var(--peach-dark);}
  .cr-mark-btn.cr-unknown-meaning{border-color:var(--lav);}
  .cr-mark-btn:hover{background:var(--mist-light);}
  .cr-mark-btn.active{background:var(--mist);color:#fff;}

  /* ---- Classification ---- */
  .class-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  .class-row{
    display:flex;align-items:center;gap:14px;padding:14px 16px;
    background:#fdfcf7;border:1.5px solid var(--border);border-radius:14px;
  }
  .class-word{font-size:18px;font-weight:800;color:var(--ink);min-width:120px;}
  .class-type{
    font-size:12px;font-weight:700;padding:5px 12px;border-radius:8px;letter-spacing:.03em;text-transform:uppercase;
  }
  .ct-known{background:var(--sage-light);color:var(--sage-dark);}
  .ct-meaning{background:var(--lav-light);color:var(--lav-dark);}
  .ct-decode{background:var(--peach-light);color:var(--peach-dark);}
  .class-note{font-size:13px;color:var(--muted);margin-left:auto;text-align:right;}

  /* ---- Meaning Support ---- */
  .meaning-card{
    background:var(--lav-light);border:1.5px solid #e2d7ef;border-radius:16px;
    padding:18px 20px;margin-bottom:14px;
  }
  .meaning-word{font-size:22px;font-weight:800;color:var(--lav-dark);margin-bottom:6px;}
  .meaning-def{font-size:15px;color:var(--ink);line-height:1.6;}
  .meaning-hint{
    margin-top:10px;background:var(--peach-light);border:1px dashed var(--peach);
    border-radius:12px;padding:10px 14px;font-size:14px;color:var(--peach-dark);text-align:center;
  }

  /* ---- Sentence Meaning ---- */
  .sentence-box{
    background:#fdfcf7;border:1.5px solid var(--border);border-radius:18px;
    padding:22px;margin-bottom:10px;
  }
  .sentence-text{font-size:17px;color:var(--ink);line-height:1.8;margin-bottom:14px;}
  .sentence-text .hl{background:var(--mist-light);padding:2px 6px;border-radius:6px;font-weight:700;color:var(--mist-dark);}
  .sentence-text .hl2{background:var(--lav-light);padding:2px 6px;border-radius:6px;font-weight:700;color:var(--lav-dark);}
  .sentence-q{font-size:15px;font-weight:700;color:var(--mist-dark);margin-bottom:10px;}
  .sentence-input{
    width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;
    font-family:inherit;font-size:15px;background:#fff;color:var(--ink);
  }
  .sentence-input:focus{outline:none;border-color:var(--mist);}

  /* ---- Gist ---- */
  .gist-prompt{
    font-size:18px;font-weight:700;color:var(--mist-dark);background:var(--mist-light);
    padding:14px 18px;border-radius:14px;text-align:center;margin-bottom:16px;
  }
  .gist-input{
    width:100%;min-height:80px;padding:14px;border:1.5px solid var(--border);border-radius:14px;
    font-family:inherit;font-size:16px;resize:vertical;background:#fff;color:var(--ink);
  }
  .gist-input:focus{outline:none;border-color:var(--mist);}

  /* ---- Word Bank ---- */
  .bank-section{margin-bottom:18px;}
  .bank-title{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sage-dark);margin-bottom:10px;}
  .bank-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .bank-chip{
    background:var(--sage-light);border:1px solid var(--sage);border-radius:10px;
    padding:7px 13px;font-size:14px;font-weight:600;color:var(--sage-dark);
  }
  .bank-chip.chunk{background:var(--lav-light);border-color:var(--lav);color:var(--lav-dark);}

  /* ---- Retrieval ---- */
  .ret-q{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:12px;line-height:1.5;}
  .ret-options{display:flex;flex-direction:column;gap:10px;}
  .ret-btn{
    text-align:left;font-size:15px;font-weight:600;padding:14px 16px;border-radius:14px;
    border:1.5px solid var(--border);background:#fff;cursor:pointer;color:var(--ink);transition:all .15s ease;
  }
  .ret-btn:hover{border-color:var(--mist);}
  .ret-btn.correct{background:var(--sage-light);border-color:var(--sage);}
  .ret-btn.incorrect{background:var(--peach-light);border-color:#dba876;}
  .ret-feedback{margin-top:14px;font-size:15px;font-weight:700;text-align:center;display:none;}
  .ret-feedback.show{display:block;}
  .ret-feedback.good{color:var(--sage-dark);}
  .ret-feedback.try-again{color:var(--peach-dark);}

  /* ---- Before/After ---- */
  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .compare-col{
    border-radius:16px;padding:20px;
  }
  .compare-before{background:var(--peach-light);border:1.5px solid #dba876;}
  .compare-after{background:var(--sage-light);border:1.5px solid var(--sage);}
  .compare-label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;}
  .compare-before .compare-label{color:var(--peach-dark);}
  .compare-after .compare-label{color:var(--sage-dark);}
  .compare-stat{font-size:32px;font-weight:800;font-family:var(--font-display);}
  .compare-before .compare-stat{color:var(--peach-dark);}
  .compare-after .compare-stat{color:var(--sage-dark);}
  .compare-desc{font-size:13px;color:var(--ink);margin-top:4px;}
  .compare-arrow{text-align:center;font-size:36px;color:var(--gold);margin:10px 0;}

  /* ---- Buttons ---- */
  .btn{font-family:var(--font-body);font-size:15px;font-weight:700;padding:13px 24px;border-radius:14px;cursor:pointer;border:none;box-shadow:var(--shadow-sm);}
  .btn-primary{
    background:linear-gradient(180deg, #f5d690 0%, var(--marquee) 45%, var(--marquee-deep) 100%);color:#4a3818;
    font-family:var(--font-body);font-size:15px;font-weight:700;padding:13px 24px;border-radius:14px;cursor:pointer;border:none;
    box-shadow:0 4px 0 #a97c3c, 0 12px 26px rgba(35,24,12,0.35), 0 1px 0 rgba(255,255,255,0.4) inset;
  }
  .btn-primary:disabled{background:#dfe3de;color:#a2a89f;box-shadow:none;cursor:not-allowed;}
  .btn-outline{
    background:#fff;border:1.5px solid var(--border);color:var(--ink);font-family:var(--font-body);font-size:14px;font-weight:600;
    padding:10px 16px;border-radius:12px;cursor:pointer;
  }
  .btn-row{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap;}

  /* ---- Flow Steps Overview ---- */
  .flow-overview{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px;}
  .flow-step{
    background:rgba(255,246,211,0.08);border:1px solid rgba(255,246,211,0.2);border-radius:12px;
    padding:10px 14px;font-size:12px;font-weight:600;color:rgba(244,236,216,0.7);text-align:center;
  }
  .flow-step .flow-icon{font-size:22px;display:block;margin-bottom:4px;}
  .flow-arrow{color:var(--marquee);font-size:18px;display:flex;align-items:center;}

  /* ---- Toast ---- */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
    background:var(--theater-1);color:var(--marquee);padding:14px 28px;border-radius:14px;
    font-size:14px;font-weight:600;box-shadow:0 12px 36px rgba(0,0,0,0.4);
    border:1px solid rgba(240,202,133,0.3);z-index:300;transition:transform .4s ease;opacity:0;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

  /* ---- Decision Trace ---- */
  .trace-box{
    background:#fdfcf7;border:1px solid var(--border);border-radius:12px;
    padding:14px;margin-bottom:10px;font-size:12.5px;line-height:1.5;
  }
  .trace-rule{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px;color:var(--muted);}
  .trace-action{font-weight:700;color:var(--ink);}

  /* ---- Celebration ---- */
  .celebrate{text-align:center;padding:20px 0;}
  .celebrate-icon{font-size:48px;margin-bottom:10px;}
  .celebrate-title{font-family:var(--font-display);font-size:26px;color:var(--sage-dark);margin-bottom:8px;}
  .celebrate-desc{font-size:15px;color:var(--ink);max-width:420px;margin:0 auto 16px;line-height:1.6;}

  /* ---- Responsive ---- */
  @media(max-width:600px){
    .card{padding:24px 18px;}
    .cold-read-text{font-size:17px;line-height:2;}
    .compare-grid{grid-template-columns:1fr;}
    .step-dot{min-width:60px;font-size:10px;}
    .step-dot .step-num{font-size:16px;}
  }
</style>
</head>
<body>
<div class="app-shell">
  <header>
    <div>
      <h1>Realtime Learning Pack</h1>
      <div class="subtitle">BRIDGE Agent — live learning flow demo</div>
    </div>
    <a class="home-link" href="../index.html">← Ava Word Bridge</a>
  </header>
  <main id="app"></main>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
//  DATA — sample text and tagged words for the demo
// ============================================================
const SAMPLE_TEXT = {
  title: "Sea Turtle Journey",
  passage: "Sea turtles travel thousands of miles across the ocean. They navigate by sensing the Earth's magnetic field, which acts like an invisible compass. When a female turtle is ready to lay eggs, she returns to the exact beach where she was born. This remarkable journey is called migration. Scientists track these gentle creatures to protect their habitat and ensure their survival.",
  taggedWords: [
    { word: "migration", status: "can-read-meaning-unknown", meaning: "the movement of animals from one place to another, usually seasonally", sentence: "This remarkable journey is called migration." },
    { word: "navigate", status: "can-read-meaning-unknown", meaning: "to find the way to a destination", sentence: "They navigate by sensing the Earth's magnetic field." },
    { word: "habitat", status: "can-read-meaning-unknown", meaning: "the natural home of a living thing", sentence: "Scientists track these gentle creatures to protect their habitat." },
  ],
  taggedChunks: [
    { chunk: "magnetic field", meaning: "an invisible force around the Earth that pulls on certain metals", sentence: "They navigate by sensing the Earth's magnetic field." },
  ],
  mainIdea: "Sea turtles travel huge distances across the ocean and return to their birthplace to lay eggs.",
  gistAnswer: "Sea turtles migrate across the ocean and return to the beach where they were born to lay eggs.",
};

const FLOW_STEPS = [
  { id:0, icon:"\uD83D\uDCD6", label:"Cold Read" },
  { id:1, icon:"\uD83C\uDFF7\uFE0F", label:"Classify" },
  { id:2, icon:"\uD83D\uDCA1", label:"Meaning" },
  { id:3, icon:"\uD83D\uDCAC", label:"Sentence" },
  { id:4, icon:"\uD83C\uDFAF", label:"Gist" },
  { id:5, icon:"\uD83C\uDFDB\uFE0F", label:"Word Bank" },
  { id:6, icon:"\uD83E\uDDEE", label:"Retrieve" },
  { id:7, icon:"\u267E\uFE0F", label:"Reread" },
];

// ============================================================
//  STATE
// ============================================================
let currentStep = 0;
let coldReadMarks = {}; // word -> mark type
let selectedMarkType = null;
let sentenceAnswers = {};
let gistAnswer = "";
let retrievalAnswer = null;
let retrievalDone = false;
let coldReadAccuracy = 0;
let rereadAccuracy = 0;

const appEl = document.getElementById('app');
const toastEl = document.getElementById('toast');

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2500);
}

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============================================================
//  RENDER — Step Track
// ============================================================
function renderStepTrack() {
  return `<div class="step-track">${FLOW_STEPS.map(s => {
    let cls = '';
    if (s.id === currentStep) cls = 'active';
    else if (s.id < currentStep) cls = 'done';
    return `<div class="step-dot ${cls}" data-step="${s.id}"><span class="step-num">${s.id+1}</span>${s.label}</div>`;
  }).join('')}</div>`;
}

function renderFlowOverview() {
  return `<div class="flow-overview">
    ${FLOW_STEPS.map((s,i) => `
      <div class="flow-step"><span class="flow-icon">${s.icon}</span>${s.label}</div>
      ${i < FLOW_STEPS.length-1 ? '<div class="flow-arrow">\u2192</div>' : ''}
    `).join('')}
  </div>`;
}

function renderCard(inner) {
  return `<div class="card">${renderStepTrack()}${inner}</div>`;
}

// ============================================================
//  STEP 0 — Cold Read
// ============================================================
function renderColdRead() {
  const tokens = SAMPLE_TEXT.passage.split(/(\s+)/);
  const tokenHtml = tokens.map(t => {
    const clean = t.replace(/[.,;:!?"'()]/g,'').trim();
    const tagged = SAMPLE_TEXT.taggedWords.find(w => w.word === clean);
    if (tagged && clean) {
      const mark = coldReadMarks[clean];
      let markCls = '';
      if (mark === 'accurate') markCls = 'cr-accurate';
      else if (mark === 'slow') markCls = 'cr-slow';
      else if (mark === 'misread') markCls = 'cr-misread';
      else if (mark === 'unknown-meaning') markCls = 'cr-unknown-meaning';
      return `<span class="cr-token ${markCls}" data-word="${escapeHtml(clean)}">${escapeHtml(t)}</span>`;
    }
    return escapeHtml(t);
  }).join('');

  const markedCount = Object.keys(coldReadMarks).length;

  return renderCard(`
    ${renderFlowOverview()}
    <h2>\uD83D\uDCD6 Cold Read</h2>
    <p class="subhead">Student reads the passage cold — no meaning hints shown yet. Teacher marks each tagged word.</p>
    <div class="cold-read-text">${tokenHtml}</div>
    <div class="cr-marking-toolbar">
      <span class="label">Mark as:</span>
      <button class="cr-mark-btn cr-accurate ${selectedMarkType==='accurate'?'active':''}" data-mark="accurate">\u2705 Accurate</button>
      <button class="cr-mark-btn cr-slow ${selectedMarkType==='slow'?'active':''}" data-mark="slow">\u23F1 Slow / Hesitant</button>
      <button class="cr-mark-btn cr-misread ${selectedMarkType==='misread'?'active':''}" data-mark="misread">\u274C Misread</button>
      <button class="cr-mark-btn cr-unknown-meaning ${selectedMarkType==='unknown-meaning'?'active':''}" data-mark="unknown-meaning">\u2754 Read OK, meaning unknown</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="coldReadNext" ${markedCount < 3 ? 'disabled' : ''}>Classify Words \u2192</button>
    </div>
    ${markedCount < 3 ? '<p style="text-align:center;font-size:13px;color:var(--muted);margin-top:8px;">Mark all 3 tagged words to continue ('+markedCount+'/3)</p>' : ''}
  `);

  // Event handlers set in attachEvents
}

// ============================================================
//  STEP 1 — Classification
// ============================================================
function renderClassification() {
  const rows = SAMPLE_TEXT.taggedWords.map(w => {
    const mark = coldReadMarks[w.word] || 'accurate';
    let type, note;
    if (mark === 'accurate') { type = 'ct-known'; note = 'Can read + knows meaning'; }
    else if (mark === 'unknown-meaning') { type = 'ct-meaning'; note = 'Can decode, meaning unknown'; }
    else if (mark === 'slow') { type = 'ct-decode'; note = 'Slow decoding, may need support'; }
    else { type = 'ct-decode'; note = 'Misread — needs decoding support'; }
    return `<div class="class-row">
      <div class="class-word">${escapeHtml(w.word)}</div>
      <span class="class-type ${type}">${mark === 'accurate' ? 'KNOWN' : mark === 'unknown-meaning' ? 'MEANING GAP' : 'DECODE GAP'}</span>
      <div class="class-note">${escapeHtml(note)}</div>
    </div>`;
  }).join('');

  // Also classify chunks
  const chunkRows = SAMPLE_TEXT.taggedChunks.map(c => {
    return `<div class="class-row">
      <div class="class-word">${escapeHtml(c.chunk)}</div>
      <span class="class-type ct-meaning">MEANING GAP</span>
      <div class="class-note">Multi-word phrase — meaning unknown</div>
    </div>`;
  }).join('');

  return renderCard(`
    <h2>\uD83C\uDFF7\uFE0F Word & Chunk Classification</h2>
    <p class="subhead">The Decision Engine routes each word based on Cold Read evidence.</p>
    <div class="class-grid">${rows}${chunkRows}</div>
    <div class="trace-box">
      <div class="trace-rule">RULE: canRead=true, meaningKnown=false \u2192 route: minimal_meaning_support</div>
      <div class="trace-action">\u2192 3 words + 1 chunk routed to Meaning Support (just enough, not a dictionary)</div>
    </div>
    <div class="trace-box">
      <div class="trace-rule">RULE: canRead=true, meaningKnown=true \u2192 route: recall_check (skip)</div>
      <div class="trace-action">\u2192 Words already known are not re-taught</div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" id="classifyNext">Show Meaning Support \u2192</button></div>
  `);
}

// ============================================================
//  STEP 2 — Meaning Support
// ============================================================
function renderMeaningSupport() {
  const wordCards = SAMPLE_TEXT.taggedWords.map(w => {
    return `<div class="meaning-card">
      <div class="meaning-word">${escapeHtml(w.word)}</div>
      <div class="meaning-def">${escapeHtml(w.meaning)}</div>
      <div class="meaning-hint">\uD83D\uDC48 Just enough meaning to unlock the sentence — not a full dictionary entry</div>
    </div>`;
  }).join('');
  const chunkCards = SAMPLE_TEXT.taggedChunks.map(c => {
    return `<div class="meaning-card" style="background:var(--mist-light);border-color:#d7e5ef;">
      <div class="meaning-word" style="color:var(--mist-dark);">${escapeHtml(c.chunk)}</div>
      <div class="meaning-def">${escapeHtml(c.meaning)}</div>
    </div>`;
  }).join('');

  return renderCard(`
    <h2>\uD83D\uDCA1 Minimal Meaning Support</h2>
    <p class="subhead">The Scaffold Engine provides just enough meaning — never more than needed.</p>
    ${wordCards}${chunkCards}
    <div class="trace-box">
      <div class="trace-rule">SCAFFOLD: meaning = teacher_prepared (not auto-generated)</div>
      <div class="trace-action">\u2192 No external API, no dictionary lookup — all meanings come from teacher intake data</div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" id="meaningNext">Build Sentence Meaning \u2192</button></div>
  `);
}

// ============================================================
//  STEP 3 — Sentence Meaning
// ============================================================
function renderSentenceMeaning() {
  const sentences = SAMPLE_TEXT.taggedWords.map((w, i) => {
    const sent = w.sentence;
    // Highlight the target word in the sentence
    const highlighted = sent.replace(new RegExp('\\b'+escapeRegex(w.word)+'\\b'), `<span class="hl">${escapeHtml(w.word)}</span>`);
    return `<div class="sentence-box">
      <div class="sentence-text">${highlighted}</div>
      <div class="sentence-q">What does "${escapeHtml(w.word)}" mean in this sentence?</div>
      <input type="text" class="sentence-input" data-word="${escapeHtml(w.word)}" placeholder="Use your own words..." value="${escapeHtml(sentenceAnswers[w.word]||'')}">
    </div>`;
  }).join('');

  // Chunk sentence
  const chunkSent = SAMPLE_TEXT.taggedChunks[0];
  const chunkHighlighted = chunkSent.sentence.replace(
    new RegExp(escapeRegex(chunkSent.chunk), 'i'),
    `<span class="hl2">${escapeHtml(chunkSent.chunk)}</span>`
  );
  const chunkBox = `<div class="sentence-box">
    <div class="sentence-text">${chunkHighlighted}</div>
    <div class="sentence-q">What does "${escapeHtml(chunkSent.chunk)}" help the turtle do?</div>
    <input type="text" class="sentence-input" data-word="${escapeHtml(chunkSent.chunk)}" placeholder="Use your own words..." value="${escapeHtml(sentenceAnswers[chunkSent.chunk]||'')}">
  </div>`;

  const answered = Object.keys(sentenceAnswers).length;

  return renderCard(`
    <h2>\uD83D\uDCAC Sentence Meaning</h2>
    <p class="subhead">Student puts the word back into its sentence and explains it in their own words.</p>
    ${sentences}${chunkBox}
    <div class="btn-row">
      <button class="btn btn-primary" id="sentenceNext" ${answered < 3 ? 'disabled' : ''}>Find the Gist \u2192</button>
    </div>
    ${answered < 3 ? '<p style="text-align:center;font-size:13px;color:var(--muted);margin-top:8px;">Answer at least 3 to continue ('+answered+'/4)</p>' : ''}
  `);
}

// ============================================================
//  STEP 4 — Gist
// ============================================================
function renderGist() {
  return renderCard(`
    <h2>\uD83C\uDFAF Gist</h2>
    <p class="subhead">Now that every word is unlocked, what is the whole passage mostly about?</p>
    <div class="gist-prompt">In one sentence, what is the main idea of this passage?</div>
    <textarea class="gist-input" id="gistInput" placeholder="Type your answer here...">${escapeHtml(gistAnswer)}</textarea>
    <div class="btn-row">
      <button class="btn btn-primary" id="gistNext" ${!gistAnswer.trim() ? 'disabled' : ''}>Save to Word Bank \u2192</button>
    </div>
  `);
}

// ============================================================
//  STEP 5 — Word Bank
// ============================================================
function renderWordBank() {
  const wordChips = SAMPLE_TEXT.taggedWords.map(w =>
    `<span class="bank-chip">${escapeHtml(w.word)}</span>`
  ).join('');
  const chunkChips = SAMPLE_TEXT.taggedChunks.map(c =>
    `<span class="bank-chip chunk">${escapeHtml(c.chunk)}</span>`
  ).join('');

  return renderCard(`
    <h2>\uD83C\uDFDB\uFE0F Personal Word Bank</h2>
    <p class="subhead">Every banked word stays linked to its source text, sentence, and word position.</p>
    <div class="bank-section">
      <div class="bank-title">Word Bank (3 new words)</div>
      <div class="bank-chips">${wordChips}</div>
    </div>
    <div class="bank-section">
      <div class="bank-title">Chunk Bank (1 new phrase)</div>
      <div class="bank-chips">${chunkChips}</div>
    </div>
    <div class="trace-box">
      <div class="trace-rule">STORAGE: localStorage — no cloud sync, no accounts</div>
      <div class="trace-action">\u2192 Student model updated: encounter + meaning evidence logged for each word</div>
    </div>
    <div class="trace-box">
      <div class="trace-rule">FADING: next encounter starts with bare recall check (not re-teach)</div>
      <div class="trace-action">\u2192 If recall succeeds \u2192 log transfer evidence on existing Bank entry (no duplicate)</div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" id="bankNext">Retrieval Practice \u2192</button></div>
  `);
}

// ============================================================
//  STEP 6 — Retrieval Practice
// ============================================================
function renderRetrieval() {
  const qWord = SAMPLE_TEXT.taggedWords[0];
  const options = [
    { text: "The movement of animals from one place to another, usually seasonally", correct: true },
    { text: "A type of sea turtle that lives in the ocean", correct: false },
    { text: "The place where baby turtles are born", correct: false },
    { text: "A scientist who studies ocean animals", correct: false },
  ];
  const optHtml = options.map((o,i) =>
    `<button class="ret-btn ${retrievalAnswer===i?(o.correct?'correct':'incorrect'):''}" data-opt="${i}">${String.fromCharCode(65+i)}. ${escapeHtml(o.text)}</button>`
  ).join('');

  let feedback = '';
  if (retrievalDone) {
    feedback = retrievalAnswer !== null && options[retrievalAnswer].correct
      ? '<div class="ret-feedback show good">\u2705 Correct! "migration" = the movement of animals from one place to another.</div>'
      : '<div class="ret-feedback show try-again">\u274C Not quite — the correct answer is A. "migration" = the movement of animals from one place to another.</div>';
  }

  return renderCard(`
    <h2>\uD83E\uDDEE Retrieval Practice</h2>
    <p class="subhead">Short check: can the student recall the meaning without any hint?</p>
    <div class="ret-q">What does <b>"${escapeHtml(qWord.word)}"</b> mean?</div>
    <div class="ret-options">${optHtml}</div>
    ${feedback}
    <div class="btn-row">
      <button class="btn btn-primary" id="retNext" ${!retrievalDone ? 'disabled' : ''}>Reread & Compare \u2192</button>
    </div>
  `);
}

// ============================================================
//  STEP 7 — Reread & Before/After
// ============================================================
function renderReread() {
  // Calculate cold read accuracy
  const totalWords = SAMPLE_TEXT.taggedWords.length;
  let accurateCount = 0;
  SAMPLE_TEXT.taggedWords.forEach(w => {
    if (coldReadMarks[w.word] === 'accurate' || coldReadMarks[w.word] === 'unknown-meaning') accurateCount++;
  });
  coldReadAccuracy = Math.round((accurateCount / totalWords) * 100);
  // Simulate improvement: after learning, student reads all words accurately
  rereadAccuracy = 100;

  return renderCard(`
    <h2>\u267E\uFE0F Reread — Before / After</h2>
    <p class="subhead">Student rereads the same passage. Compare the evidence.</p>
    <div class="compare-grid">
      <div class="compare-col compare-before">
        <div class="compare-label">\uD83D\uDCD6 Before (Cold Read)</div>
        <div class="compare-stat">${coldReadAccuracy}%</div>
        <div class="compare-desc">Words read accurately or with known meaning</div>
      </div>
      <div class="compare-col compare-after">
        <div class="compare-label">\u267E\uFE0F After (Reread)</div>
        <div class="compare-stat">${rereadAccuracy}%</div>
        <div class="compare-desc">All tagged words now read accurately with meaning</div>
      </div>
    </div>
    <div class="compare-arrow">\u2192</div>
    <div class="celebrate">
      <div class="celebrate-icon">\uD83C\uDF89</div>
      <div class="celebrate-title">Evidence of Growth</div>
      <div class="celebrate-desc">The student met the same words again — this time with full understanding. Every banked word is linked to its source text for future retrieval.</div>
    </div>
    <div class="btn-row">
      <a href="../index.html" class="btn btn-outline">\u2190 Back to Ava Word Bridge</a>
      <button class="btn btn-primary" id="restartBtn">Restart Demo \u21BA</button>
    </div>
  `);
}

// ============================================================
//  ROUTER
// ============================================================
function render() {
  let html;
  switch(currentStep) {
    case 0: html = renderColdRead(); break;
    case 1: html = renderClassification(); break;
    case 2: html = renderMeaningSupport(); break;
    case 3: html = renderSentenceMeaning(); break;
    case 4: html = renderGist(); break;
    case 5: html = renderWordBank(); break;
    case 6: html = renderRetrieval(); break;
    case 7: html = renderReread(); break;
    default: html = renderColdRead();
  }
  appEl.innerHTML = html;
  attachEvents();
  window.scrollTo({top:0, behavior:'smooth'});
}

// ============================================================
//  EVENT ATTACHMENT
// ============================================================
function attachEvents() {
  // Step track navigation (only allow going back to completed steps)
  appEl.querySelectorAll('.step-dot').forEach(dot => {
    dot.addEventListener('click', () => {
      const step = parseInt(dot.dataset.step);
      if (step < currentStep) { currentStep = step; render(); }
    });
  });

  // Cold Read
  if (currentStep === 0) {
    appEl.querySelectorAll('.cr-mark-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedMarkType = btn.dataset.mark;
        render();
      });
    });
    appEl.querySelectorAll('.cr-token').forEach(tok => {
      tok.addEventListener('click', () => {
        if (!selectedMarkType) { showToast('Pick a marking type first'); return; }
        coldReadMarks[tok.dataset.word] = selectedMarkType;
        render();
      });
    });
    const nextBtn = document.getElementById('coldReadNext');
    if (nextBtn) nextBtn.addEventListener('click', () => {
      currentStep = 1; render();
    });
  }

  // Classification
  if (currentStep === 1) {
    const btn = document.getElementById('classifyNext');
    if (btn) btn.addEventListener('click', () => { currentStep = 2; render(); });
  }

  // Meaning Support
  if (currentStep === 2) {
    const btn = document.getElementById('meaningNext');
    if (btn) btn.addEventListener('click', () => { currentStep = 3; render(); });
  }

  // Sentence Meaning
  if (currentStep === 3) {
    appEl.querySelectorAll('.sentence-input').forEach(inp => {
      inp.addEventListener('input', () => {
        sentenceAnswers[inp.dataset.word] = inp.value;
      });
    });
    const btn = document.getElementById('sentenceNext');
    if (btn) btn.addEventListener('click', () => {
      if (Object.keys(sentenceAnswers).length >= 3) { currentStep = 4; render(); }
    });
  }

  // Gist
  if (currentStep === 4) {
    const inp = document.getElementById('gistInput');
    if (inp) {
      inp.addEventListener('input', () => {
        gistAnswer = inp.value;
        const btn = document.getElementById('gistNext');
        if (btn) btn.disabled = !gistAnswer.trim();
      });
    }
    const btn = document.getElementById('gistNext');
    if (btn) btn.addEventListener('click', () => {
      if (gistAnswer.trim()) { currentStep = 5; render(); }
    });
  }

  // Word Bank
  if (currentStep === 5) {
    const btn = document.getElementById('bankNext');
    if (btn) btn.addEventListener('click', () => { currentStep = 6; render(); });
  }

  // Retrieval
  if (currentStep === 6) {
    appEl.querySelectorAll('.ret-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        retrievalAnswer = parseInt(btn.dataset.opt);
        retrievalDone = true;
        render();
      });
    });
    const btn = document.getElementById('retNext');
    if (btn) btn.addEventListener('click', () => {
      if (retrievalDone) { currentStep = 7; render(); }
    });
  }

  // Reread
  if (currentStep === 7) {
    const btn = document.getElementById('restartBtn');
    if (btn) btn.addEventListener('click', () => {
      // Reset all state
      currentStep = 0;
      coldReadMarks = {};
      selectedMarkType = null;
      sentenceAnswers = {};
      gistAnswer = "";
      retrievalAnswer = null;
      retrievalDone = false;
      render();
    });
  }
}

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// ============================================================
//  INIT
// ============================================================
render();
</script>
</body>
</html>
