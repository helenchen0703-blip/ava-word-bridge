<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realtime Learning Pack | Ava Word Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6ee; --card:#ffffff; --ink:#1a1a3e; --muted:#7a7a9e; --border:#e8e8f5;
    --mist:#3DA9F5; --mist-light:#e3f2fd; --mist-dark:#0d47a1;
    --sage:#2ECC71; --sage-light:#e8f8ee; --sage-dark:#1b8e4e;
    --lav:#9B59E0; --lav-light:#f3edfd; --lav-dark:#6a2eb5;
    --peach:#FF6B9D; --peach-light:#ffe8f0; --peach-dark:#c91467;
    --gold:#FFB938; --gold-light:#fff5e0; --gold-dark:#b88600;
    --coral:#FF7043; --coral-light:#ffe5db; --coral-dark:#bf360c;
    --highlight:#FFEB3B; --highlight-border:#F9A825;
    --shadow-sm: 0 2px 8px rgba(26,26,62,0.08);
    --radius-lg: 26px; --radius-md: 16px;
    --font-display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --font-body:"Plus Jakarta Sans","Avenir Next","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --bg-1:#f0f4ff; --bg-2:#fff5f8; --text-dark:#1a1a3e; --text-light:#1a1a3e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: linear-gradient(135deg, #f0f4ff 0%, #fff5f8 50%, #f0fff4 100%);
    color:var(--text-dark); font-family:var(--font-body); line-height:1.6; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .app-shell{max-width:820px;margin:0 auto;padding:0 22px 40px;min-height:100vh;display:flex;flex-direction:column;}
  header{padding:26px 0 8px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;}
  header h1{font-family:var(--font-display);font-size:24px;color:var(--lav-dark);margin:0;font-weight:700;}
  header .subtitle{font-size:13px;color:var(--muted);}
  header .header-links{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  header .home-link{font-size:13px;color:var(--mist);text-decoration:none;font-weight:600;}
  header .home-link:hover{color:var(--mist-dark);}
  header .library-link{font-size:13px;color:var(--lav);text-decoration:none;font-weight:600;background:var(--lav-light);padding:6px 14px;border-radius:10px;border:1.5px solid var(--lav);transition:all .15s ease;}
  header .library-link:hover{background:var(--lav);color:#fff;}
  main{flex:1;padding-top:14px;}
  .card{
    background:#ffffff;border-radius:var(--radius-lg);
    box-shadow:0 8px 32px rgba(26,26,62,0.10), 0 2px 8px rgba(26,26,62,0.06);
    padding:36px 36px 32px;width:100%;position:relative;
    border:2px solid #e8e8f5;
  }
  h2{font-family:var(--font-display);font-size:24px;margin:0 0 12px;color:var(--ink);font-weight:600;}
  h3{font-family:var(--font-display);font-size:18px;margin:0 0 8px;color:var(--ink);font-weight:600;}
  .lead{font-size:16px;color:var(--ink);}
  .subhead{font-size:14px;color:var(--muted);margin:0 0 18px;}
  .step-hint{font-size:13px;color:var(--mist-dark);background:var(--mist-light);padding:10px 14px;border-radius:12px;margin-bottom:16px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--mist);}
  .step-hint b{color:var(--mist-dark);}

  /* Header Phase Progress — Disney bright */
  .phase-bar{display:flex;gap:4px;margin-top:14px;padding:6px;background:#ffffff;border-radius:14px;box-shadow:0 4px 16px rgba(26,26,62,0.08);border:2px solid #e8e8f5;}
  .phase-seg{
    flex:1;padding:10px 6px;border-radius:10px;text-align:center;cursor:pointer;
    background:#f5f5fa;transition:all .25s ease;
    border:2px solid transparent;position:relative;overflow:hidden;
  }
  .phase-seg .phase-name{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#7a7a9e;margin-bottom:3px;}
  .phase-seg .phase-count{display:block;font-size:9px;color:#9a9aae;font-weight:600;}
  .phase-seg .phase-bar-fill{position:absolute;left:0;bottom:0;height:4px;width:0;border-radius:0 0 10px 10px;transition:width .4s ease;}
  .phase-seg.s-prepare .phase-bar-fill{background:var(--peach);}
  .phase-seg.s-assess .phase-bar-fill{background:var(--gold);}
  .phase-seg.s-comprehend .phase-bar-fill{background:var(--lav);}
  .phase-seg.s-retain .phase-bar-fill{background:var(--sage);}
  .phase-seg.s-grow .phase-bar-fill{background:var(--mist);}
  .phase-seg.active.s-prepare{background:var(--peach-light);border-color:var(--peach);}
  .phase-seg.active.s-assess{background:var(--gold-light);border-color:var(--gold);}
  .phase-seg.active.s-comprehend{background:var(--lav-light);border-color:var(--lav);}
  .phase-seg.active.s-retain{background:var(--sage-light);border-color:var(--sage);}
  .phase-seg.active.s-grow{background:var(--mist-light);border-color:var(--mist);}
  .phase-seg.active .phase-name{color:var(--ink);}
  .phase-seg.active.s-prepare .phase-name{color:var(--peach-dark);}
  .phase-seg.active.s-assess .phase-name{color:var(--gold-dark);}
  .phase-seg.active.s-comprehend .phase-name{color:var(--lav-dark);}
  .phase-seg.active.s-retain .phase-name{color:var(--sage-dark);}
  .phase-seg.active.s-grow .phase-name{color:var(--mist-dark);}
  .phase-seg.done{background:#f5f5fa;border-color:transparent;}
  .phase-seg.done .phase-name{color:#9a9aae;}
  .phase-seg.done .phase-bar-fill{width:100%;}

  /* Step Track */
  .step-track{display:flex;gap:4px;margin-bottom:24px;flex-wrap:wrap;}
  .step-dot{
    flex:1;min-width:70px;text-align:center;padding:8px 4px;border-radius:10px;
    font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    background:#f5f5fa;color:#9a9aae;
    transition:all .3s ease;cursor:pointer;border:2px solid transparent;
  }
  .step-dot .step-num{display:block;font-size:18px;margin-bottom:2px;font-family:var(--font-display);}
  .step-dot.active{background:var(--lav-light);border-color:var(--lav);color:var(--lav-dark);}
  .step-dot.done{background:var(--sage-light);border-color:var(--sage);color:var(--sage-dark);}

  /* Buttons */
  .btn{font-family:var(--font-body);font-size:15px;font-weight:700;padding:13px 24px;border-radius:14px;cursor:pointer;border:none;}
  .btn-primary{
    background:linear-gradient(135deg, var(--lav) 0%, var(--peach) 100%);color:#fff;
    box-shadow:0 4px 14px rgba(155,89,224,0.35);
  }
  .btn-primary:disabled{background:#d0d0e0;color:#8a8aaa;box-shadow:none;cursor:not-allowed;}
  .btn-outline{background:#fff;border:2px solid var(--mist);color:var(--mist-dark);font-size:14px;font-weight:600;padding:10px 16px;border-radius:12px;cursor:pointer;}
  .btn-row{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap;}

  /* Text Input */
  .text-input{width:100%;min-height:160px;padding:14px;border:2px solid var(--border);border-radius:14px;font-family:var(--font-display);font-size:16px;line-height:1.8;resize:vertical;background:#fafaff;color:var(--ink);}
  .text-input:focus{outline:none;border-color:var(--lav);box-shadow:0 0 0 3px var(--lav-light);}
  .text-input::placeholder{color:var(--muted);font-family:var(--font-body);font-size:14px;}

  /* Word suggestion chips */
  .word-suggest-area{margin-top:18px;}
  .word-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .word-chip{
    display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;
    border:1.5px solid var(--border);background:#fff;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .15s ease;
  }
  .word-chip.selected{background:var(--lav-light);border-color:var(--lav);color:var(--lav-dark);}
  .word-chip .remove{font-size:16px;color:var(--peach);margin-left:4px;border:none;background:none;cursor:pointer;padding:0;line-height:1;}

  /* Meaning input rows */
  .meaning-rows{display:flex;flex-direction:column;gap:12px;margin-top:14px;}
  .meaning-row{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:start;}
  .meaning-row .word-label{font-size:15px;font-weight:800;color:var(--ink);padding:10px 0;font-family:var(--font-display);}
  .meaning-row input{padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;width:100%;background:#fff;color:var(--ink);}
  .meaning-row input:focus{outline:none;border-color:var(--mist);}

  /* Chunk input */
  .chunk-row{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:start;margin-bottom:10px;}
  .chunk-row input{padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;width:100%;background:#fff;color:var(--ink);}
  .chunk-row input:focus{outline:none;border-color:var(--lav);}

  /* Cold Read */
  .cold-read-text{font-size:19px;line-height:2.4;color:var(--ink);font-family:var(--font-display);padding:20px;background:#fafaff;border:2px solid var(--lav-light);border-radius:16px;}
  .cr-token{
    cursor:pointer;padding:3px 5px;border-radius:6px;transition:all .15s ease;display:inline;
    background:var(--highlight);border-bottom:3px solid var(--highlight-border);font-weight:700;
  }
  .cr-token:hover{background:#fff176;}
  .cr-token.cr-accurate{background:var(--sage-light);border-bottom-color:var(--sage);}
  .cr-token.cr-slow{background:var(--gold-light);border-bottom-color:var(--gold);}
  .cr-token.cr-misread{background:var(--peach-light);border-bottom-color:var(--peach);}
  .cr-token.cr-unknown-meaning{background:var(--lav-light);border-bottom-color:var(--lav);}
  .cr-marking-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;align-items:center;padding:16px;background:var(--mist-light);border-radius:14px;border:2px solid var(--mist);}
  .cr-marking-toolbar .label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mist-dark);margin-right:4px;}
  .cr-mark-btn{padding:8px 14px;border-radius:10px;border:2px solid transparent;background:#fff;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .15s ease;}
  .cr-mark-btn.cr-accurate{border-color:var(--sage);}
  .cr-mark-btn.cr-slow{border-color:var(--gold);}
  .cr-mark-btn.cr-misread{border-color:var(--peach);}
  .cr-mark-btn.cr-unknown-meaning{border-color:var(--lav);}
  .cr-mark-btn:hover{background:var(--mist-light);}
  .cr-mark-btn.active{background:var(--mist);color:#fff;border-color:var(--mist);}

  /* Classification */
  .class-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .class-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fafaff;border:2px solid var(--border);border-radius:14px;flex-wrap:wrap;}
  .class-word{font-size:17px;font-weight:800;color:var(--ink);min-width:100px;font-family:var(--font-display);}
  .class-type{font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;letter-spacing:.03em;text-transform:uppercase;}
  .ct-known{background:var(--sage-light);color:var(--sage-dark);}
  .ct-meaning{background:var(--lav-light);color:var(--lav-dark);}
  .ct-decode{background:var(--peach-light);color:var(--peach-dark);}
  .class-note{font-size:13px;color:var(--muted);margin-left:auto;}

  /* Meaning Support */
  .meaning-card{background:var(--lav-light);border:2px solid var(--lav);border-radius:16px;padding:18px 20px;margin-bottom:14px;}
  .meaning-word{font-size:20px;font-weight:800;color:var(--lav-dark);margin-bottom:6px;font-family:var(--font-display);}
  .meaning-def{font-size:15px;color:var(--ink);line-height:1.6;}
  .meaning-card.chunk{background:var(--mist-light);border-color:var(--mist);}
  .meaning-card.chunk .meaning-word{color:var(--mist-dark);}

  /* Sentence Meaning */
  .sentence-box{background:#fafaff;border:2px solid var(--border);border-radius:18px;padding:20px;margin-bottom:10px;}
  .sentence-text{font-size:17px;color:var(--ink);line-height:1.8;margin-bottom:14px;font-family:var(--font-display);}
  .sentence-text .hl{background:var(--highlight);padding:2px 6px;border-radius:6px;font-weight:700;}
  .sentence-text .hl2{background:var(--lav-light);padding:2px 6px;border-radius:6px;font-weight:700;color:var(--lav-dark);}
  .sentence-q{font-size:14px;font-weight:700;color:var(--mist-dark);margin-bottom:10px;}
  .sentence-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink);}
  .sentence-input:focus{outline:none;border-color:var(--mist);}

  /* Gist */
  .gist-prompt{font-size:17px;font-weight:700;color:var(--mist-dark);background:var(--mist-light);padding:14px 18px;border-radius:14px;text-align:center;margin-bottom:16px;}
  .gist-input{width:100%;min-height:80px;padding:14px;border:1.5px solid var(--border);border-radius:14px;font-family:inherit;font-size:16px;resize:vertical;background:#fff;color:var(--ink);}
  .gist-input:focus{outline:none;border-color:var(--mist);}

  /* Word Bank */
  .bank-section{margin-bottom:18px;}
  .bank-title{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sage-dark);margin-bottom:10px;}
  .bank-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .bank-chip{background:var(--sage-light);border:1px solid var(--sage);border-radius:10px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--sage-dark);}
  .bank-chip.chunk{background:var(--lav-light);border-color:var(--lav);color:var(--lav-dark);}

  /* Retrieval */
  .ret-q{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:12px;line-height:1.5;}
  .ret-options{display:flex;flex-direction:column;gap:10px;}
  .ret-btn{text-align:left;font-size:15px;font-weight:600;padding:14px 16px;border-radius:14px;border:2px solid var(--border);background:#fff;cursor:pointer;color:var(--ink);transition:all .15s ease;}
  .ret-btn:hover{border-color:var(--mist);}
  .ret-btn.correct{background:var(--sage-light);border-color:var(--sage);}
  .ret-btn.incorrect{background:var(--peach-light);border-color:var(--peach);}
  .ret-feedback{margin-top:14px;font-size:15px;font-weight:700;text-align:center;display:none;}
  .ret-feedback.show{display:block;}
  .ret-feedback.good{color:var(--sage-dark);}
  .ret-feedback.try-again{color:var(--peach-dark);}

  /* Before/After */
  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .compare-col{border-radius:16px;padding:20px;}
  .compare-before{background:var(--peach-light);border:2px solid var(--peach);}
  .compare-after{background:var(--sage-light);border:2px solid var(--sage);}
  .compare-label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;}
  .compare-before .compare-label{color:var(--peach-dark);}
  .compare-after .compare-label{color:var(--sage-dark);}
  .compare-stat{font-size:32px;font-weight:800;font-family:var(--font-display);}
  .compare-before .compare-stat{color:var(--peach-dark);}
  .compare-after .compare-stat{color:var(--sage-dark);}
  .compare-desc{font-size:13px;color:var(--ink);margin-top:4px;}
  .celebrate{text-align:center;padding:20px 0;}
  .celebrate-icon{font-size:48px;margin-bottom:10px;}
  .celebrate-title{font-family:var(--font-display);font-size:26px;color:var(--sage-dark);margin-bottom:8px;}
  .celebrate-desc{font-size:15px;color:var(--ink);max-width:420px;margin:0 auto 16px;line-height:1.6;}

  /* Trace */
  .trace-box{background:#fafaff;border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;font-size:12.5px;line-height:1.5;}
  .trace-rule{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px;color:var(--muted);}
  .trace-action{font-weight:700;color:var(--ink);}

  /* Add word manual */
  .manual-add{display:flex;gap:8px;margin-top:10px;align-items:center;}
  .manual-add input{padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;flex:1;background:#fff;color:var(--ink);}
  .manual-add input:focus{outline:none;border-color:var(--mist);}
  .add-btn{padding:8px 14px;border-radius:10px;border:2px solid var(--lav);background:var(--lav-light);color:var(--lav-dark);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}

  /* Empty state */
  .empty-state{text-align:center;padding:20px;color:var(--muted);font-size:14px;}

  /* Toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--lav);color:#fff;padding:14px 28px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 12px 36px rgba(155,89,224,0.3);z-index:300;transition:transform .4s ease,opacity .4s ease;opacity:0;}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

  /* === Review Library === */
  .review-list{display:flex;flex-direction:column;gap:12px;}
  .review-card{
    display:flex;align-items:center;gap:14px;padding:16px 18px;
    background:#fff;border:2px solid var(--border);border-radius:16px;
    transition:all .2s ease;
  }
  .review-card:hover{border-color:var(--lav);box-shadow:0 4px 16px rgba(155,89,224,0.10);}
  .review-card-info{flex:1;min-width:0;}
  .review-card-date{font-size:12px;color:var(--muted);font-weight:600;}
  .review-card-title{font-size:16px;font-weight:700;color:var(--ink);font-family:var(--font-display);margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .review-card-meta{font-size:13px;color:var(--muted);}
  .review-card-actions{display:flex;gap:8px;flex-shrink:0;}
  .review-btn{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:2px solid transparent;transition:all .15s ease;}
  .review-btn.view{background:var(--lav-light);color:var(--lav-dark);border-color:var(--lav);}
  .review-btn.view:hover{background:var(--lav);color:#fff;}
  .review-btn.delete{background:var(--peach-light);color:var(--peach-dark);border-color:var(--peach);}
  .review-btn.delete:hover{background:var(--peach);color:#fff;}

  /* === Review Detail === */
  .review-section{margin-bottom:24px;}
  .review-section-title{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--lav-dark);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .review-word-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .review-word-card{background:var(--lav-light);border:1.5px solid var(--lav);border-radius:12px;padding:10px 14px;min-width:140px;}
  .review-word-card.chunk{background:var(--mist-light);border-color:var(--mist);}
  .review-word-card .rw-word{font-weight:800;color:var(--lav-dark);font-size:15px;font-family:var(--font-display);}
  .review-word-card.chunk .rw-word{color:var(--mist-dark);}
  .review-word-card .rw-meaning{font-size:13px;color:var(--ink);margin-top:3px;line-height:1.4;}
  .review-answer-box{font-size:15px;color:var(--ink);padding:10px 14px;background:var(--mist-light);border-radius:10px;border:1.5px solid var(--mist);margin-top:8px;}

  /* Saved badge */
  .saved-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--sage-dark);background:var(--sage-light);padding:8px 16px;border-radius:10px;border:1.5px solid var(--sage);}

  /* Responsive */
  @media(max-width:600px){
    .card{padding:24px 18px;}
    .cold-read-text{font-size:17px;line-height:2.2;}
    .compare-grid{grid-template-columns:1fr;}
    .step-dot{min-width:50px;font-size:9px;}
    .step-dot .step-num{font-size:15px;}
    .meaning-row{grid-template-columns:1fr;}
    .chunk-row{grid-template-columns:1fr;}
    .review-card{flex-direction:column;align-items:stretch;}
    .review-card-actions{justify-content:flex-end;}
  }
</style>
</head>
<body>
<div class="app-shell">
  <header>
    <div style="flex:1;min-width:0;">
      <h1>Realtime Learning Pack</h1>
      <div class="subtitle" id="stepSubtitle">Paste any text. Turn it into a learning session.</div>
      <div class="phase-bar" id="phaseBar"></div>
    </div>
    <div class="header-links">
      <a href="javascript:void(0)" class="library-link" id="libraryBtn">📚 Review Library</a>
      <a class="home-link" href="../index.html">← Ava Word Bridge</a>
    </div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
//  STATE
// ============================================================
let sessionData = {

// Phase groups: step indices → phase
const PHASES = [
  { id:'prepare',    name:'Prepare',     steps:[0],              color:'var(--peach)' },
  { id:'assess',     name:'Assess',      steps:[1,2],            color:'var(--gold)' },
  { id:'comprehend', name:'Comprehend',  steps:[3,4,5],          color:'var(--lav)' },

  { id:'grow',       name:'Grow',        steps:[8],              color:'var(--mist)' },
];

const STORAGE_KEY = 'ava-learning-sessions';

function getCurrentPhaseIdx() {
  for (let i = PHASES.length - 1; i >= 0; i--) {
    if (PHASES[i].steps.includes(currentStep)) return i;
  }
  return 0;
}

function renderHeaderProgress() {
  const phaseBar = document.getElementById('phaseBar');
  if (!phaseBar) return;
  if (currentView !== 'session') { phaseBar.style.display = 'none'; return; }
  phaseBar.style.display = '';
  const curPhase = getCurrentPhaseIdx();
  phaseBar.innerHTML = PHASES.map((p, i) => {
    const isActive = i === curPhase;
    const isDone = i < curPhase;
    let fillPct = 0;
    if (isDone) fillPct = 100;
    else if (isActive) {
      const stepsInPhase = p.steps.length;
      const stepOffset = p.steps.indexOf(currentStep);
      fillPct = Math.round(((stepOffset + 1) / stepsInPhase) * 100);
    }
    const cls = isActive ? 'active' : (isDone ? 'done' : '');
    return `<div class="phase-seg s-${p.id} ${cls}" data-phase="${i}">
      <span class="phase-name">${p.name}</span>
      <span class="phase-count">${p.steps.length} step${p.steps.length>1?'s':''}</span>
      <div class="phase-bar-fill" style="width:${fillPct}%;"></div>
    </div>`;
  }).join('');
  phaseBar.querySelectorAll('.phase-seg').forEach(seg => {
    seg.addEventListener('click', () => {
      const phaseIdx = parseInt(seg.dataset.phase);
      if (phaseIdx < curPhase) {
        currentStep = PHASES[phaseIdx].steps[0];
        render();
      }
    });
  });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// Count syllables in a word (simple heuristic)
function countSyllables(word) {
  word = word.toLowerCase().replace(/[^a-z]/g, '');
  if (word.length <= 3) return 1;
  word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '');
  word = word.replace(/^y/, '');
  const matches = word.match(/[aeiouy]{1,2}/g);
  return matches ? matches.length : 1;
}

// Auto-suggest challenging words from text
function suggestWords(text) {
  const words = text.split(/\s+/).map(w => w.replace(/[.,;:!?"'()\[\]{}]/g, '')).filter(w => w.length > 0);
  const seen = new Set();
  const suggestions = [];
  for (const w of words) {
    const lower = w.toLowerCase();
    if (seen.has(lower)) continue;
    seen.add(lower);
    if (lower.length < 6) continue;
    if (COMMON_WORDS.has(lower)) continue;
    const syl = countSyllables(lower);
    if (syl >= 3 || lower.length >= 9) {
      suggestions.push(w);
    }
  }
  return suggestions.slice(0, 30);
}

// Find sentence containing a word
function findSentence(text, word) {
  const sentences = text.match(/[^.!?]+[.!?]*/g) || [text];
  for (const s of sentences) {
    const re = new RegExp('\\b' + escapeRegex(word) + '\\b', 'i');
    if (re.test(s)) return s.trim();
  }
  const re = new RegExp('[^.!?]*\\b' + escapeRegex(word) + '\\b[^.!?]*', 'i');
  const m = text.match(re);
  return m ? m[0].trim() : '';
}

// Generate a title from text (first sentence or first 60 chars)
function makeTitle(text) {
  const firstSentence = text.trim().split(/[.!?]/)[0].trim();
  return firstSentence.length > 60 ? firstSentence.slice(0, 57) + '...' : (firstSentence || 'Untitled');
}

// ============================================================
//  LOCALSTORAGE — Save / Load / Delete
// ============================================================
function getSavedSessions() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch { return []; }
}

function saveSession() {
  if (!sessionData.text.trim()) return;
  const sessions = getSavedSessions();
  const session = {
    id: Date.now(),
    title: makeTitle(sessionData.text),
    date: new Date().toISOString(),
    text: sessionData.text,
    words: JSON.parse(JSON.stringify(sessionData.words)),
    chunks: JSON.parse(JSON.stringify(sessionData.chunks)),
    coldReadMarks: JSON.parse(JSON.stringify(sessionData.coldReadMarks)),
    sentenceAnswers: JSON.parse(JSON.stringify(sessionData.sentenceAnswers)),
    gistAnswer: sessionData.gistAnswer,
    retrievalAnswer: sessionData.retrievalAnswer,
    retrievalDone: sessionData.retrievalDone,
    retrievalCorrect: sessionData.retrievalCorrect,
  };
  // Replace existing session with same text, or add new
  const existingIdx = sessions.findIndex(s => s.text === sessionData.text);
  if (existingIdx >= 0) {
    session.id = sessions[existingIdx].id; // keep original ID
    sessions[existingIdx] = session;
  } else {
    sessions.unshift(session);
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
  sessionData.savedAt = Date.now();
}

function deleteSessionById(id) {
  const sessions = getSavedSessions().filter(s => s.id !== id);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
}

function formatDate(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'}) + ' · ' +
         d.toLocaleTimeString('en-US', {hour:'numeric',minute:'2-digit'});
}

// ============================================================
//  STEP 1 — Cold Read
// ============================================================
function renderColdRead() {
  subtitleEl.textContent = "Cold Read — student reads aloud, teacher marks each word.";

  const words = sessionData.words.map(w => w.word);
  const text = sessionData.text;

  const taggedSet = new Set(words.map(w => w.toLowerCase()));
  const tokens = text.split(/(\s+)/);
  const tokenHtml = tokens.map(t => {
    const clean = t.replace(/[.,;:!?"'()\[\]{}]/g, '').trim();
    if (clean && taggedSet.has(clean.toLowerCase())) {
      const mark = sessionData.coldReadMarks[clean.toLowerCase()];
      let markCls = '';
      if (mark === 'accurate') markCls = 'cr-accurate';
      else if (mark === 'slow') markCls = 'cr-slow';
      else if (mark === 'misread') markCls = 'cr-misread';
      else if (mark === 'unknown-meaning') markCls = 'cr-unknown-meaning';
      return `<span class="cr-token ${markCls}" data-word="${escapeHtml(clean.toLowerCase())}">${escapeHtml(t)}</span>`;
    }
    return escapeHtml(t);
  }).join('');

  const markedCount = Object.keys(sessionData.coldReadMarks).length;
  const totalWords = sessionData.words.length;

  return renderCard(`
    <div class="step-hint"><b>How to use:</b> Pick a marking type below, then click each <span style="background:var(--highlight);padding:1px 4px;border-radius:3px;border-bottom:2px solid var(--highlight-border);font-weight:600;">highlighted word</span> in the text.</div>

    <div class="cold-read-text">${tokenHtml}</div>

    <div class="cr-marking-toolbar">
      <span class="label">Mark as:</span>
      <button class="cr-mark-btn cr-accurate ${selectedMarkType==='accurate'?'active':''}" data-mark="accurate">✅ Accurate</button>
      <button class="cr-mark-btn cr-slow ${selectedMarkType==='slow'?'active':''}" data-mark="slow">⏱ Slow / Hesitant</button>
      <button class="cr-mark-btn cr-misread ${selectedMarkType==='misread'?'active':''}" data-mark="misread">❌ Misread</button>
      <button class="cr-mark-btn cr-unknown-meaning ${selectedMarkType==='unknown-meaning'?'active':''}" data-mark="unknown-meaning">❓ Read OK, meaning unknown</button>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="coldReadNext" ${markedCount < totalWords ? 'disabled' : ''}>Classify words →</button>
    </div>
    ${markedCount < totalWords ? '<p style="text-align:center;font-size:13px;color:var(--muted);margin-top:8px;">Mark all '+totalWords+' highlighted words to continue ('+markedCount+'/'+totalWords+')</p>' : ''}
  `);
}

// ============================================================
//  STEP 2 — Classification
// ============================================================
function renderClassification() {
  subtitleEl.textContent = "Classification — Decision Engine routes each word.";

  const rows = sessionData.words.map(w => {
    const mark = sessionData.coldReadMarks[w.word.toLowerCase()] || 'accurate';
    let type, note, cls;
    if (mark === 'accurate') { cls = 'ct-known'; type = 'KNOWN'; note = 'Can read + knows meaning'; }
    else if (mark === 'unknown-meaning') { cls = 'ct-meaning'; type = 'MEANING GAP'; note = 'Can decode, meaning unknown'; }
    else if (mark === 'slow') { cls = 'ct-decode'; type = 'DECODE GAP'; note = 'Slow decoding, may need support'; }
    else { cls = 'ct-decode'; type = 'DECODE GAP'; note = 'Misread — needs decoding support'; }
    return `<div class="class-row">
      <div class="class-word">${escapeHtml(w.word)}</div>
      <span class="class-type ${cls}">${type}</span>
      <div class="class-note">${escapeHtml(note)}</div>
    </div>`;
  }).join('');

  const chunkRows = sessionData.chunks.filter(c => c.chunk).map(c => {
    return `<div class="class-row">
      <div class="class-word">${escapeHtml(c.chunk)}</div>
      <span class="class-type ct-meaning">MEANING GAP</span>
      <div class="class-note">Multi-word phrase — meaning unknown</div>
    </div>`;
  }).join('');

  const needMeaning = sessionData.words.filter(w => {
    const mark = sessionData.coldReadMarks[w.word.toLowerCase()];
    return mark !== 'accurate';
  }).length;

  return renderCard(`
    <h2>Word & chunk classification</h2>
    <p class="subhead">The Decision Engine routes each word based on Cold Read evidence.</p>
    <div class="class-grid">${rows}${chunkRows}</div>
    <div class="trace-box">
      <div class="trace-rule">RULE: canRead=true, meaningKnown=false → route: minimal_meaning_support</div>
      <div class="trace-action">→ ${needMeaning} word(s) + ${sessionData.chunks.filter(c=>c.chunk).length} chunk(s) routed to Meaning Support</div>
    </div>
    <div class="trace-box">
      <div class="trace-rule">RULE: canRead=true, meaningKnown=true → route: recall_check (skip re-teach)</div>
      <div class="trace-action">→ Words already known are not re-taught</div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" id="classifyNext">Show meaning support →</button></div>
  `);
}

// ============================================================
//  STEP 3 — Meaning Support
// ============================================================
function renderMeaningSupport() {
  subtitleEl.textContent = "Meaning Support — just enough, not a dictionary.";

  const needMeaningWords = sessionData.words.filter(w => {
    const mark = sessionData.coldReadMarks[w.word.toLowerCase()];
    return mark !== 'accurate' && w.meaning;
  });
  const allWordsWithMeaning = sessionData.words.filter(w => w.meaning);
  const chunksWithMeaning = sessionData.chunks.filter(c => c.chunk && c.meaning);

  const wordCards = (needMeaningWords.length > 0 ? needMeaningWords : allWordsWithMeaning).map(w => {
    return `<div class="meaning-card">
      <div class="meaning-word">${escapeHtml(w.word)}</div>
      <div class="meaning-def">${escapeHtml(w.meaning)}</div>
    </div>`;
  }).join('');

  const chunkCards = chunksWithMeaning.map(c => {
    return `<div class="meaning-card chunk">
      <div class="meaning-word">${escapeHtml(c.chunk)}</div>
      <div class="meaning-def">${escapeHtml(c.meaning)}</div>
    </div>`;
  }).join('');

  return renderCard(`
    <h2>Minimal meaning support</h2>
    <p class="subhead">The Scaffold Engine shows just enough meaning — never more than needed. All meanings are teacher-prepared.</p>
    ${wordCards || '<div class="empty-state">No meanings provided for words that need support.</div>'}
    ${chunkCards}
    <div class="trace-box">
      <div class="trace-rule">SCAFFOLD: meaning = teacher_prepared (not auto-generated, no external API)</div>
      <div class="trace-action">→ Every meaning comes from the intake data you typed in Step 1</div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" id="meaningNext">Build sentence meaning →</button></div>
  `);
}

// ============================================================
//  STEP 4 — Sentence Meaning
// ============================================================
function renderSentenceMeaning() {
  subtitleEl.textContent = "Sentence meaning — student explains words in context.";

  const boxes = sessionData.words.filter(w => w.meaning).map(w => {
    const sent = findSentence(sessionData.text, w.word);
    const highlighted = sent.replace(new RegExp('\\b'+escapeRegex(w.word)+'\\b', 'i'), `<span class="hl">${escapeHtml(w.word)}</span>`);
    return `<div class="sentence-box">
      <div class="sentence-text">${highlighted}</div>
      <div class="sentence-q">What does "${escapeHtml(w.word)}" mean in this sentence?</div>
      <input type="text" class="sentence-input" data-word="${escapeHtml(w.word)}" placeholder="Use your own words..." value="${escapeHtml(sessionData.sentenceAnswers[w.word]||'')}">
    </div>`;
  }).join('');

  const chunkBoxes = sessionData.chunks.filter(c => c.chunk && c.meaning).map(c => {
    const sent = findSentence(sessionData.text, c.chunk);
    const highlighted = sent.replace(new RegExp(escapeRegex(c.chunk), 'i'), `<span class="hl2">${escapeHtml(c.chunk)}</span>`);
    return `<div class="sentence-box">
      <div class="sentence-text">${highlighted}</div>
      <div class="sentence-q">What does "${escapeHtml(c.chunk)}" mean here?</div>
      <input type="text" class="sentence-input" data-word="${escapeHtml(c.chunk)}" placeholder="Use your own words..." value="${escapeHtml(sessionData.sentenceAnswers[c.chunk]||'')}">
    </div>`;
  }).join('');

  const answered = Object.keys(sessionData.sentenceAnswers).length;
  const total = sessionData.words.filter(w => w.meaning).length + sessionData.chunks.filter(c => c.chunk && c.meaning).length;

  return renderCard(`
    <h2>Sentence meaning</h2>
    <p class="subhead">Student puts each word back into its sentence and explains it in their own words.</p>
    ${boxes || '<div class="empty-state">No words with meanings to practice.</div>'}
    ${chunkBoxes}
    <div class="btn-row">
      <button class="btn btn-primary" id="sentenceNext" ${total > 0 && answered < Math.min(3, total) ? 'disabled' : ''}>Find the gist →</button>
    </div>
    ${total > 0 && answered < Math.min(3, total) ? '<p style="text-align:center;font-size:13px;color:var(--muted);margin-top:8px;">Answer at least '+Math.min(3,total)+' to continue ('+answered+'/'+Math.min(3,total)+')</p>' : ''}
  `);
}

// ============================================================
//  STEP 7 — Retrieval Practice
// ============================================================
function renderRetrieval() {
  subtitleEl.textContent = "Retrieval practice — can the student recall without hints?";

  const wordsWithMeaning = sessionData.words.filter(w => w.meaning);
  if (wordsWithMeaning.length === 0) {
    return renderCard(`
      <h2>Retrieval practice</h2>
      <div class="empty-state">No words with meanings to practice. Go back and add meanings in Step 1.</div>
      <div class="btn-row"><button class="btn btn-primary" id="retNext">Skip to reread →</button></div>
    `);
  }

  const qWord = wordsWithMeaning[0];
  const correctMeaning = qWord.meaning;
  const otherMeanings = wordsWithMeaning.slice(1).map(w => w.meaning);

  const genericDistractors = [
    "A type of animal that lives in the ocean",
    "The place where something happens",
    "A person who studies science",
    "To move quickly from one place to another",
    "Something that is very old",
  ];
  const distractors = [...otherMeanings, ...genericDistractors].slice(0, 3);

  const allOptions = [{text: correctMeaning, correct: true}, ...distractors.map(d => ({text: d, correct: false}))];
  for (let i = allOptions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allOptions[i], allOptions[j]] = [allOptions[j], allOptions[i]];
  }

  const optHtml = allOptions.map((o, i) =>
    `<button class="ret-btn ${sessionData.retrievalAnswer===i?(o.correct?'correct':'incorrect'):''}" data-opt="${i}" data-correct="${o.correct}">${String.fromCharCode(65+i)}. ${escapeHtml(o.text)}</button>`
  ).join('');

  let feedback = '';
  if (sessionData.retrievalDone) {
    feedback = sessionData.retrievalCorrect
      ? '<div class="ret-feedback show good">✅ Correct! "'+escapeHtml(qWord.word)+'" = '+escapeHtml(correctMeaning)+'</div>'
      : '<div class="ret-feedback show try-again">❌ Not quite — "'+escapeHtml(qWord.word)+'" = '+escapeHtml(correctMeaning)+'</div>';
  }

  return renderCard(`
    <h2>Retrieval practice</h2>
    <p class="subhead">Short check: can the student recall the meaning without any hint?</p>
    <div class="ret-q">What does <b>"${escapeHtml(qWord.word)}"</b> mean?</div>
    <div class="ret-options">${optHtml}</div>
    ${feedback}
    <div class="btn-row">
      <button class="btn btn-primary" id="retNext" ${!sessionData.retrievalDone ? 'disabled' : ''}>Reread & compare →</button>
    </div>
  `);
}

// ============================================================
//  STEP 8 — Reread / Before-After
// ============================================================
function renderReread() {
  subtitleEl.textContent = "Reread — compare before and after.";

  // Auto-save when reaching this step
  if (!sessionData.savedAt) {
    saveSession();
    showToast('Session saved to Review Library ✓');
  }

  const totalWords = sessionData.words.length;
  let accurateCount = 0;
  sessionData.words.forEach(w => {
    const mark = sessionData.coldReadMarks[w.word.toLowerCase()];
    if (mark === 'accurate' || mark === 'unknown-meaning') accurateCount++;
  });
  const coldAccuracy = totalWords > 0 ? Math.round((accurateCount / totalWords) * 100) : 0;
  const rereadAccuracy = 100;

  const savedBadge = sessionData.savedAt ?
    '<div style="text-align:center;margin-bottom:16px;"><span class="saved-badge">✓ Saved to Review Library</span></div>' : '';

  return renderCard(`
    ${savedBadge}
    <h2>Reread — before / after</h2>
    <p class="subhead">Student rereads the same passage. Compare the evidence.</p>
    <div class="compare-grid">
      <div class="compare-col compare-before">
        <div class="compare-label">📖 Before (Cold Read)</div>
        <div class="compare-stat">${coldAccuracy}%</div>
        <div class="compare-desc">Words read accurately or with known meaning</div>
      </div>
      <div class="compare-col compare-after">
        <div class="compare-label">♾️ After (Reread)</div>
        <div class="compare-stat">${rereadAccuracy}%</div>
        <div class="compare-desc">All tagged words now read accurately with meaning</div>
      </div>
    </div>
    <div class="celebrate">
      <div class="celebrate-icon">🎉</div>
      <div class="celebrate-title">Evidence of growth</div>
      <div class="celebrate-desc">The student met the same words again — this time with full understanding. Every banked word is linked to its source text for future retrieval.</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" id="goLibraryFromRereadBtn">📚 Review Library</button>
      <button class="btn btn-primary" id="restartBtn">New text ↻</button>
    </div>
  `);
}

// ============================================================
//  REVIEW DETAIL — Show full saved session
// ============================================================
function renderReviewDetail() {
  const sessions = getSavedSessions();
  const session = sessions.find(s => s.id === reviewingSessionId);
  if (!session) {
    currentView = 'library';
    return renderReviewLibrary();
  }

  subtitleEl.textContent = "Reviewing saved session · " + formatDate(session.date);

  // Text with highlighted words (showing cold read marks)
  const taggedSet = new Set((session.words||[]).map(w => w.word.toLowerCase()));
  const tokens = (session.text||'').split(/(\s+)/);
  const tokenHtml = tokens.map(t => {
    const clean = t.replace(/[.,;:!?"'()\[\]{}]/g, '').trim();
    if (clean && taggedSet.has(clean.toLowerCase())) {
      const mark = (session.coldReadMarks||{})[clean.toLowerCase()];
      let markCls = '';
      if (mark === 'accurate') markCls = 'cr-accurate';
      else if (mark === 'slow') markCls = 'cr-slow';
      else if (mark === 'misread') markCls = 'cr-misread';
      else if (mark === 'unknown-meaning') markCls = 'cr-unknown-meaning';
      return `<span class="cr-token ${markCls}">${escapeHtml(t)}</span>`;
    }
    return escapeHtml(t);
  }).join('');

  // Word meanings
  const wordMeaningHtml = (session.words||[]).filter(w => w.meaning).map(w =>
    `<div class="review-word-card"><div class="rw-word">${escapeHtml(w.word)}</div><div class="rw-meaning">${escapeHtml(w.meaning)}</div></div>`
  ).join('');
  const chunkMeaningHtml = (session.chunks||[]).filter(c => c.chunk && c.meaning).map(c =>
    `<div class="review-word-card chunk"><div class="rw-word">${escapeHtml(c.chunk)}</div><div class="rw-meaning">${escapeHtml(c.meaning)}</div></div>`
  ).join('');

  // Classification
  const classHtml = (session.words||[]).map(w => {
    const mark = (session.coldReadMarks||{})[w.word.toLowerCase()] || 'accurate';
    let type, note, cls;
    if (mark === 'accurate') { cls = 'ct-known'; type = 'KNOWN'; note = 'Can read + knows meaning'; }
    else if (mark === 'unknown-meaning') { cls = 'ct-meaning'; type = 'MEANING GAP'; note = 'Can decode, meaning unknown'; }
    else if (mark === 'slow') { cls = 'ct-decode'; type = 'DECODE GAP'; note = 'Slow decoding'; }
    else { cls = 'ct-decode'; type = 'DECODE GAP'; note = 'Misread'; }
    return `<div class="class-row"><div class="class-word">${escapeHtml(w.word)}</div><span class="class-type ${cls}">${type}</span><div class="class-note">${escapeHtml(note)}</div></div>`;
  }).join('');

  // Sentence answers
  const sentenceHtml = Object.entries(session.sentenceAnswers||{}).filter(([_,v]) => v && v.trim()).map(([word, answer]) => {
    const sent = findSentence(session.text||'', word);
    const highlighted = sent.replace(new RegExp('\\b'+escapeRegex(word)+'\\b','i'), `<span class="hl">${escapeHtml(word)}</span>`);
    return `<div class="sentence-box"><div class="sentence-text">${highlighted}</div><div class="sentence-q">What does "${escapeHtml(word)}" mean here?</div><div class="review-answer-box">${escapeHtml(answer)}</div></div>`;
  }).join('');

  // Gist
  const gistHtml = session.gistAnswer && session.gistAnswer.trim() ?
    `<div class="review-answer-box" style="font-size:16px;">${escapeHtml(session.gistAnswer)}</div>` : '<div class="empty-state">No gist written.</div>';

  // Word bank chips
  const bankChips = (session.words||[]).map(w => `<span class="bank-chip">${escapeHtml(w.word)}</span>`).join('');
  const chunkBankChips = (session.chunks||[]).filter(c => c.chunk).map(c => `<span class="bank-chip chunk">${escapeHtml(c.chunk)}</span>`).join('');

  // Retrieval result
  let retrievalHtml = '';
  if (session.retrievalDone) {
    const wordsWithMeaning = (session.words||[]).filter(w => w.meaning);
    if (wordsWithMeaning.length > 0) {
      retrievalHtml = session.retrievalCorrect
        ? `<div class="ret-feedback show good">✅ Correctly recalled: "${escapeHtml(wordsWithMeaning[0].word)}" = ${escapeHtml(wordsWithMeaning[0].meaning)}</div>`
        : `<div class="ret-feedback show try-again">❌ Did not recall correctly — reviewed the meaning</div>`;
    }
  } else {
    retrievalHtml = '<div class="empty-state">Retrieval practice not completed.</div>';
  }

  // Before/After
  const totalWords = (session.words||[]).length;
  let accurateCount = 0;
  (session.words||[]).forEach(w => {
    const mark = (session.coldReadMarks||{})[w.word.toLowerCase()];
    if (mark === 'accurate' || mark === 'unknown-meaning') accurateCount++;
  });
  const coldAccuracy = totalWords > 0 ? Math.round((accurateCount / totalWords) * 100) : 0;

  return renderCard(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px;">
      <button class="btn btn-outline" id="backToLibraryBtn" style="padding:8px 16px;font-size:13px;">← Library</button>
      <span style="font-size:13px;color:var(--muted);font-weight:600;">${formatDate(session.date)}</span>
    </div>

    <h2>${escapeHtml(session.title)}</h2>

    <div class="review-section">
      <div class="review-section-title">📖 Original Text</div>
      <div class="cold-read-text">${tokenHtml}</div>
    </div>

    ${(wordMeaningHtml||chunkMeaningHtml) ? `<div class="review-section">
      <div class="review-section-title">📝 Word Meanings</div>
      <div class="review-word-grid">${wordMeaningHtml}${chunkMeaningHtml}</div>
    </div>` : ''}

    ${classHtml ? `<div class="review-section">
      <div class="review-section-title">🏷️ Classification</div>
      <div class="class-grid">${classHtml}</div>
    </div>` : ''}

    ${sentenceHtml ? `<div class="review-section">
      <div class="review-section-title">💬 Sentence Meaning</div>
      ${sentenceHtml}
    </div>` : ''}

    <div class="review-section">
      <div class="review-section-title">💡 Gist</div>
      ${gistHtml}
    </div>

    ${(bankChips||chunkBankChips) ? `<div class="review-section">
      <div class="review-section-title">🏦 Word Bank</div>
      <div class="bank-chips">${bankChips}${chunkBankChips}</div>
    </div>` : ''}

    <div class="review-section">
      <div class="review-section-title">🧠 Retrieval Practice</div>
      ${retrievalHtml}
    </div>

    <div class="review-section">
      <div class="review-section-title">📊 Growth</div>
      <div class="compare-grid">
        <div class="compare-col compare-before">
          <div class="compare-label">📖 Before (Cold Read)</div>
          <div class="compare-stat">${coldAccuracy}%</div>
          <div class="compare-desc">Words read accurately</div>
        </div>
        <div class="compare-col compare-after">
          <div class="compare-label">♾️ After (Reread)</div>
          <div class="compare-stat">100%</div>
          <div class="compare-desc">All words now understood</div>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-outline" id="backToLibraryBtn2">← Back to library</button>
      <button class="btn btn-primary" id="newSessionFromReviewBtn">Start new session →</button>
    </div>
  `);
}

// ============================================================
//  ROUTER
// ============================================================
function render() {
  let html;
  if (currentView === 'library') {
    html = renderReviewLibrary();
  } else if (currentView === 'review') {
    html = renderReviewDetail();
  } else {
    switch(currentStep) {
      case 0: html = renderInput(); break;
      case 1: html = renderColdRead(); break;
      case 2: html = renderClassification(); break;
      case 3: html = renderMeaningSupport(); break;
      case 4: html = renderSentenceMeaning(); break;
      case 5: html = renderGist(); break;
      case 6: html = renderWordBank(); break;
      case 7: html = renderRetrieval(); break;
      case 8: html = renderReread(); break;
      default: html = renderInput();
    }
  }
  appEl.innerHTML = html;
  renderHeaderProgress();
  attachEvents();
  window.scrollTo({top:0, behavior:'smooth'});
}

// ============================================================
//  EVENT ATTACHMENT
// ============================================================
function attachEvents() {
  // Header library button (always available)
  const libBtn = document.getElementById('libraryBtn');
  if (libBtn) libBtn.addEventListener('click', () => {
    currentView = 'library';
    render();
  });

  // === Review Library events ===
  if (currentView === 'library') {
    const newBtn = document.getElementById('newSessionBtn');
    if (newBtn) newBtn.addEventListener('click', () => {
      sessionData = {text:"", title:"", words:[], chunks:[], coldReadMarks:{}, sentenceAnswers:{}, gistAnswer:"", retrievalAnswer:null, retrievalDone:false, retrievalCorrect:false, savedAt:null};
      selectedMarkType = null;
      currentStep = 0;
      currentView = 'session';
      render();
    });
    appEl.querySelectorAll('[data-review-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        reviewingSessionId = parseInt(btn.dataset.reviewId);
        currentView = 'review';
        render();
      });
    });
    appEl.querySelectorAll('[data-delete-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = parseInt(btn.dataset.deleteId);
        const sessions = getSavedSessions();
        const s = sessions.find(s => s.id === id);
        if (s && confirm('Delete this saved session?\n"' + s.title + '"')) {
          deleteSessionById(id);
          showToast('Session deleted');
          render();
        }
      });
    });
  }

  // === Review Detail events ===
  if (currentView === 'review') {
    const backBtn = document.getElementById('backToLibraryBtn');
    if (backBtn) backBtn.addEventListener('click', () => {
      currentView = 'library';
      render();
    });
    const backBtn2 = document.getElementById('backToLibraryBtn2');
    if (backBtn2) backBtn2.addEventListener('click', () => {
      currentView = 'library';
      render();
    });
    const newBtn = document.getElementById('newSessionFromReviewBtn');
    if (newBtn) newBtn.addEventListener('click', () => {
      sessionData = {text:"", title:"", words:[], chunks:[], coldReadMarks:{}, sentenceAnswers:{}, gistAnswer:"", retrievalAnswer:null, retrievalDone:false, retrievalCorrect:false, savedAt:null};
      selectedMarkType = null;
      currentStep = 0;
      currentView = 'session';
      render();
    });
  }

  // === Session events (steps 0-8) ===
  if (currentView !== 'session') return;

  // Library link on step 0
  const goLibraryLink = document.getElementById('goLibraryLink');
  if (goLibraryLink) goLibraryLink.addEventListener('click', () => {
    currentView = 'library';
    render();
  });

  // Library link on step 8
  const goLibraryFromReread = document.getElementById('goLibraryFromRereadBtn');
  if (goLibraryFromReread) goLibraryFromReread.addEventListener('click', () => {
    currentView = 'library';
    render();
  });

  // Step track navigation
  appEl.querySelectorAll('.step-dot').forEach(dot => {
    dot.addEventListener('click', () => {
      const step = parseInt(dot.dataset.step);
      if (step < currentStep) { currentStep = step; render(); }
    });
  });

  // Step 0 — Input
  if (currentStep === 0) {
    const textInput = document.getElementById('textInput');
    if (textInput) {
      textInput.addEventListener('input', () => {
        sessionData.text = textInput.value;
        const analyzeBtn = document.getElementById('analyzeBtn');
        if (analyzeBtn) analyzeBtn.disabled = !sessionData.text.trim();
      });
    }

    const analyzeBtn = document.getElementById('analyzeBtn');
    if (analyzeBtn) analyzeBtn.addEventListener('click', () => {
      const suggested = suggestWords(sessionData.text);
      const existing = new Set(sessionData.words.map(w => w.word.toLowerCase()));
      suggested.forEach(w => {
        if (!existing.has(w.toLowerCase())) {
          sessionData.words.push({word: w, meaning: ''});
        }
      });
      render();
    });

    appEl.querySelectorAll('.word-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const word = chip.dataset.word;
        const idx = sessionData.words.findIndex(w => w.word.toLowerCase() === word.toLowerCase());
        if (idx >= 0) {
          sessionData.words.splice(idx, 1);
        } else {
          sessionData.words.push({word: word, meaning: ''});
        }
        render();
      });
    });

    appEl.querySelectorAll('.meaning-row input[data-idx]').forEach(inp => {
      inp.addEventListener('input', () => {
        const idx = parseInt(inp.dataset.idx);
        sessionData.words[idx].meaning = inp.value;
        const startBtn = document.getElementById('startSessionBtn');
        if (startBtn) startBtn.disabled = sessionData.words.filter(w => w.meaning).length === 0;
      });
    });

    const manualInput = document.getElementById('manualWordInput');
    const manualBtn = document.getElementById('manualAddBtn');
    if (manualBtn) manualBtn.addEventListener('click', () => {
      const word = manualInput.value.trim();
      if (!word) return;
      const exists = sessionData.words.find(w => w.word.toLowerCase() === word.toLowerCase());
      if (!exists) {
        sessionData.words.push({word: word, meaning: ''});
        render();
      }
    });
    if (manualInput) manualInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); manualBtn.click(); }
    });

    appEl.querySelectorAll('.chunk-row input[data-chunk-idx]').forEach(inp => {
      inp.addEventListener('input', () => {
        const idx = parseInt(inp.dataset.chunkIdx);
        const field = inp.dataset.field;
        if (!sessionData.chunks[idx]) sessionData.chunks[idx] = {chunk:'', meaning:''};
        sessionData.chunks[idx][field] = inp.value;
      });
    });

    const addChunkBtn = document.getElementById('addChunkBtn');
    if (addChunkBtn) addChunkBtn.addEventListener('click', () => {
      sessionData.chunks.push({chunk: '', meaning: ''});
      render();
    });

    const startBtn = document.getElementById('startSessionBtn');
    if (startBtn) startBtn.addEventListener('click', () => {
      sessionData.words = sessionData.words.filter(w => w.word);
      sessionData.chunks = sessionData.chunks.filter(c => c.chunk);
      if (sessionData.words.length > 0) {
        currentStep = 1;
        render();
      }
    });
  }

  // Step 1 — Cold Read
  if (currentStep === 1) {
    appEl.querySelectorAll('.cr-mark-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedMarkType = btn.dataset.mark;
        render();
      });
    });
    appEl.querySelectorAll('.cr-token').forEach(tok => {
      tok.addEventListener('click', () => {
        if (!selectedMarkType) { showToast('Pick a marking type first'); return; }
        sessionData.coldReadMarks[tok.dataset.word] = selectedMarkType;
        render();
      });
    });
    const nextBtn = document.getElementById('coldReadNext');
    if (nextBtn) nextBtn.addEventListener('click', () => {
      currentStep = 2; render();
    });
  }

  // Step 2 — Classify
  if (currentStep === 2) {
    const btn = document.getElementById('classifyNext');
    if (btn) btn.addEventListener('click', () => { currentStep = 3; render(); });
  }

  // Step 3 — Meaning
  if (currentStep === 3) {
    const btn = document.getElementById('meaningNext');
    if (btn) btn.addEventListener('click', () => { currentStep = 4; render(); });
  }

  // Step 4 — Sentence
  if (currentStep === 4) {
    appEl.querySelectorAll('.sentence-input').forEach(inp => {
      inp.addEventListener('input', () => {
        sessionData.sentenceAnswers[inp.dataset.word] = inp.value;
        const total = sessionData.words.filter(w => w.meaning).length + sessionData.chunks.filter(c => c.chunk && c.meaning).length;
        const answered = Object.keys(sessionData.sentenceAnswers).length;
        const btn = document.getElementById('sentenceNext');
        if (btn) btn.disabled = answered < Math.min(3, total);
      });
    });
    const btn = document.getElementById('sentenceNext');
    if (btn) btn.addEventListener('click', () => {
      const total = sessionData.words.filter(w => w.meaning).length + sessionData.chunks.filter(c => c.chunk && c.meaning).length;
      const answered = Object.keys(sessionData.sentenceAnswers).length;
      if (answered >= Math.min(3, total) || total === 0) { currentStep = 5; render(); }
    });
  }

  // Step 5 — Gist
  if (currentStep === 5) {
    const inp = document.getElementById('gistInput');
    if (inp) {
      inp.addEventListener('input', () => {
        sessionData.gistAnswer = inp.value;
        const btn = document.getElementById('gistNext');
        if (btn) btn.disabled = !sessionData.gistAnswer.trim();
      });
    }
    const btn = document.getElementById('gistNext');
    if (btn) btn.addEventListener('click', () => {
      if (sessionData.gistAnswer.trim()) { currentStep = 6; render(); }
    });
  }

  // Step 6 — Bank
  if (currentStep === 6) {
    const btn = document.getElementById('bankNext');
    if (btn) btn.addEventListener('click', () => { currentStep = 7; render(); });
  }

  // Step 7 — Retrieval
  if (currentStep === 7) {
    appEl.querySelectorAll('.ret-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        sessionData.retrievalAnswer = parseInt(btn.dataset.opt);
        sessionData.retrievalDone = true;
        sessionData.retrievalCorrect = btn.dataset.correct === 'true';
        render();
      });
    });
    const btn = document.getElementById('retNext');
    if (btn) btn.addEventListener('click', () => {
      if (sessionData.retrievalDone || sessionData.words.filter(w => w.meaning).length === 0) {
        currentStep = 8; render();
      }
    });
  }

  // Step 8 — Reread
  if (currentStep === 8) {
    const btn = document.getElementById('restartBtn');
    if (btn) btn.addEventListener('click', () => {
      sessionData = {text:"", title:"", words:[], chunks:[], coldReadMarks:{}, sentenceAnswers:{}, gistAnswer:"", retrievalAnswer:null, retrievalDone:false, retrievalCorrect:false, savedAt:null};
      selectedMarkType = null;
      currentStep = 0;
      render();
    });
  }
}

// ============================================================
//  INIT
// ============================================================
render();
</script>
</body>
</html>
