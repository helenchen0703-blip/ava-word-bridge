<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ava Word Bridge | 7-Day Reading Journey</title>

<style>

:root {
  --ink: #26384d;
  --blue: #304d79;
  --purple: #705d8b;
  --green: #56827a;
  --cream: #f7f4ee;
  --card: #ffffff;
  --line: #e5e7eb;
  --soft: #f3f1f7;
  --gold: #f2dda8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #f8f5ef,
      #f1f5f3
    );

  color: var(--ink);
}

button,
a {
  font: inherit;
}


/* =========================================
   PAGE
========================================= */

.page {
  max-width: 920px;
  margin: auto;
  padding: 18px 14px 60px;
}


/* =========================================
   TOP
========================================= */

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.home {
  background: #ffffff;
  color: #66547f;
  text-decoration: none;

  padding: 10px 15px;

  border-radius: 13px;

  font-weight: 800;

  box-shadow:
    0 3px 12px rgba(0,0,0,0.06);
}

.badge {
  background: var(--gold);
  color: #5f4d20;

  padding: 10px 15px;

  border-radius: 13px;

  font-weight: 850;
}


/* =========================================
   HERO
========================================= */

.hero {
  margin-top: 16px;

  background: #ffffff;

  border-radius: 28px;

  padding: 28px 20px;

  text-align: center;

  box-shadow:
    0 8px 28px rgba(0,0,0,0.07);
}

.hero .emoji {
  font-size: 52px;
}

.hero h1 {
  margin: 7px 0;

  color: var(--blue);

  font-size: 36px;
}

.tag {
  color: var(--purple);

  font-weight: 850;

  font-size: 19px;
}

.goal {
  max-width: 610px;

  margin: 18px auto 0;

  background: #eef4ff;

  padding: 14px 17px;

  border-radius: 17px;

  line-height: 1.55;
}


/* =========================================
   DAY NAVIGATION
========================================= */

.days {
  margin-top: 18px;

  background: #ffffff;

  border-radius: 22px;

  padding: 14px;

  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  gap: 8px;

  box-shadow:
    0 5px 18px rgba(0,0,0,0.05);
}

.daybtn {
  border: 0;

  border-radius: 14px;

  background: #f4f4f5;

  color: #5f6670;

  padding: 11px 5px;

  cursor: pointer;

  font-weight: 800;

  line-height: 1.2;
}

.daybtn small {
  display: block;

  font-weight: 650;

  margin-top: 4px;
}

.daybtn.active {
  background: #eeeaf5;

  color: #5e4c75;

  outline:
    2px solid #826f9b;
}

.daybtn.done::after {
  content: " ✓";
}


/* =========================================
   MAIN PANEL
========================================= */

.panel {
  margin-top: 20px;

  background: #ffffff;

  border-radius: 28px;

  padding: 24px;

  box-shadow:
    0 8px 28px rgba(0,0,0,0.07);
}

.panel h2 {
  margin: 0;

  color: var(--blue);

  font-size: 27px;
}

.panel-sub {
  color: #6d7580;

  line-height: 1.55;

  margin-top: 7px;
}


/* =========================================
   PROGRESS
========================================= */

.progress {
  margin-top: 16px;
}

.progress-row {
  display: flex;

  justify-content: space-between;

  font-weight: 800;
}

.track {
  height: 13px;

  background: #e7e8eb;

  border-radius: 999px;

  overflow: hidden;

  margin-top: 8px;
}

.fill {
  height: 100%;

  background:
    linear-gradient(
      90deg,
      var(--purple),
      #8da1bc
    );

  width: 0;

  transition: 0.25s;
}


/* =========================================
   WORD
========================================= */

.activity {
  margin-top: 18px;
}

.word-chip {
  display: inline-block;

  background: #f0edf6;

  color: #625078;

  border-radius: 999px;

  padding: 7px 12px;

  font-weight: 800;

  font-size: 14px;
}

.word {
  font-size: 40px;

  text-align: center;

  color: var(--blue);

  font-weight: 900;

  margin: 17px 0 7px;
}

.instruction {
  text-align: center;

  color: #747b84;

  font-size: 14px;
}


/* =========================================
   IMAGE
========================================= */

.imagebox {
  height: 285px;

  border-radius: 22px;

  background:
    linear-gradient(
      135deg,
      #edf2f6,
      #f7efe6
    );

  margin-top: 18px;

  overflow: hidden;

  display: flex;

  align-items: center;

  justify-content: center;
}

.imagebox img {
  width: 100%;

  height: 100%;

  object-fit: cover;
}

.fallback {
  display: none;

  flex-direction: column;

  align-items: center;

  text-align: center;

  padding: 20px;
}

.fallback .em {
  font-size: 76px;
}

.fallback b {
  margin-top: 12px;

  font-size: 19px;

  color: #52667c;
}


/* =========================================
   AUDIO
========================================= */

.audio-row {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

  margin-top: 16px;
}

.audio-btn,
.primary,
.secondary,
.option,
.selfbtn {
  border: 0;

  border-radius: 14px;

  padding: 13px 14px;

  cursor: pointer;

  font-weight: 800;
}

.audio-btn {
  background: #edf3fb;

  color: var(--blue);
}

.audio-status {
  text-align: center;

  color: #68788b;

  font-size: 13px;

  min-height: 20px;

  margin-top: 8px;
}


/* =========================================
   BOXES
========================================= */

.box {
  border-radius: 18px;

  padding: 18px;

  margin-top: 17px;
}

.meaningbox {
  background: #fff7e5;
}

.sentencebox {
  background: #edf6f1;
}

.hintbox {
  background: #f2eef7;
}

.label {
  font-size: 12px;

  text-transform: uppercase;

  letter-spacing: 0.8px;

  font-weight: 900;

  margin-bottom: 8px;

  color: #7d6b3d;
}

.bigtext {
  font-size: 20px;

  line-height: 1.6;

  font-weight: 700;
}


/* =========================================
   CHINESE
========================================= */

.chinese {
  display: none;

  text-align: center;

  color: #59486e;

  font-size: 18px;

  font-weight: 750;
}

.secondary {
  background: #ffffff;

  border:
    2px solid var(--purple);

  color: var(--purple);

  display: block;

  margin: 14px auto 0;
}


/* =========================================
   QUESTIONS
========================================= */

.qcard {
  margin-top: 18px;

  background: #f5f6f9;

  border-radius: 18px;

  padding: 18px;
}

.qtitle {
  text-align: center;

  font-size: 19px;

  font-weight: 900;

  line-height: 1.45;
}

.options {
  display: grid;

  gap: 9px;

  margin-top: 13px;
}

.option {
  background: #ffffff;

  border:
    2px solid #dfe2e7;

  text-align: left;

  color: #34465b;
}

.option.correct {
  background: #dff0e4;

  border-color: #7baa88;
}

.option.wrong {
  background: #fae7df;

  border-color: #c79182;
}

.feedback {
  display: none;

  margin-top: 11px;

  border-radius: 13px;

  padding: 12px;

  text-align: center;

  font-weight: 800;
}


/* =========================================
   SELF CHECK
========================================= */

.self {
  border-top:
    2px solid #eeeeee;

  margin-top: 20px;

  padding-top: 18px;
}

.self-title {
  text-align: center;

  font-weight: 900;

  font-size: 18px;
}

.self-grid {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

  margin-top: 12px;
}

.selfbtn.know {
  background: #dcefe2;

  color: #345d42;
}

.selfbtn.help {
  background: #f7e5c8;

  color: #725522;
}

.primary {
  display: block;

  width: 100%;

  margin-top: 15px;

  background: var(--purple);

  color: #ffffff;

  font-size: 17px;
}

.next {
  display: none;
}


/* =========================================
   SCHOOL TEXT
========================================= */

.textpassage {
  background: #f8f7fb;

  border-left:
    5px solid #80709a;

  border-radius: 16px;

  padding: 19px;

  font-size: 20px;

  line-height: 1.75;

  margin-top: 18px;
}

.mini-note {
  font-size: 13px;

  color: #777777;

  margin-top: 8px;
}


/* =========================================
   SUMMARY
========================================= */

.summary {
  display: none;

  text-align: center;
}

.summary .star {
  font-size: 60px;
}

.summary h3 {
  font-size: 28px;

  color: var(--blue);
}

.result {
  background: #f3f1f7;

  border-radius: 18px;

  padding: 18px;

  line-height: 1.8;

  margin-top: 15px;
}


/* =========================================
   FOOTER
========================================= */

.footer {
  text-align: center;

  color: #737980;

  margin-top: 24px;

  line-height: 1.6;

  font-size: 14px;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 760px) {

  .days {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .daybtn:last-child {
    grid-column:
      span 2;
  }

  .panel {
    padding:
      20px 15px;
  }

  .word {
    font-size: 34px;
  }

  .audio-row,
  .self-grid {
    grid-template-columns:
      1fr;
  }

  .imagebox {
    height: 230px;
  }

  .hero h1 {
    font-size: 30px;
  }

}

</style>

</head>

/* =====================================================
   DAY INFORMATION
===================================================== */

const dayMeta = [

  {
    n: 1,
    name: "Discover",
    icon: "🔍"
  },

  {
    n: 2,
    name: "Remember",
    icon: "🧠"
  },

  {

  },

  },

  {

  },

  {
    n: 6,
    name: "School Text",
    icon: "📚"
  },

  {
    n: 7,
    name: "I Can!",
    icon: "⭐"
  }

];



/* =====================================================
   STATE
===================================================== */

let state = {

  day: 1,

  index: 0,

  score: 0,

  hints: 0,

  responses: []

};



const activity =
  document.getElementById(
    "activityView"
  );


const summary =
  document.getElementById(
    "summaryView"
  );


const wordAudio =
  document.getElementById(
    "wordAudio"
  );


const sentenceAudio =
  document.getElementById(
    "sentenceAudio"
  );



/* =====================================================
   LOCAL STORAGE
===================================================== */

function saved() {

  try {

    return (
      JSON.parse(
        localStorage.getItem(
          "avaReading7Day"
        )
      ) || {}
    );

  }

  catch(error) {

    return {};

  }

}



function saveDay(data) {

  const allData =
    saved();


  allData[
    "day" + state.day
  ] = data;


  localStorage.setItem(

    "avaReading7Day",

    JSON.stringify(
      allData
    )

  );


  renderNav();

}



/* =====================================================
   NAVIGATION
===================================================== */

function renderNav() {

  const data =
    saved();


  document.getElementById(
    "dayNav"
  ).innerHTML =

    dayMeta
      .map(

        day => `

        <button

          class="
          daybtn

          ${
            state.day === day.n
              ? "active"
              : ""
          }

          ${
            data["day" + day.n]
              ?.complete
              ? "done"
              : ""
          }
          "

          onclick="
            startDay(${day.n})
          ">

          <div>

            ${day.icon}
            Day ${day.n}

          </div>

          <small>

            ${day.name}

          </small>

        </button>

        `

      )
      .join("");

}



/* =====================================================
   START DAY
===================================================== */

function startDay(number) {

  stopAudio();


  state = {

    day: number,

    index: 0,

    score: 0,

    hints: 0,

    responses: []

  };


  summary.style.display =
    "none";


  activity.style.display =
    "block";


  renderNav();


  renderDay();

}



/* =====================================================
   HEADER
===================================================== */

function header(
  title,
  subtitle,
  total
) {

  return `

  <h2>

    ${title}

  </h2>


  <div class="panel-sub">

    ${subtitle}

  </div>


  <div class="progress">

    <div class="progress-row">

      <span>

        Progress

      </span>

      <span>

        ${
          Math.min(
            state.index + 1,
            total
          )
        }

        /

        ${total}

      </span>

    </div>


    <div class="track">

      <div

        class="fill"

        style="
          width:
          ${
            (
              state.index /
              total
            ) * 100
          }%
        ">

      </div>

    </div>

  </div>

  `;

}



/* =====================================================
   HELPERS
===================================================== */

function shuffled(array) {

  return [...array]
    .sort(
      () =>
        Math.random() - 0.5
    );

}



function imageBlock(item) {

  return `

  <div class="imagebox">

    <img

      src="
        assets/images/reading/day1/
        ${item.slug}.jpg
      "

      alt="
        ${item.word} visual
      "

      onerror="
        this.style.display='none';
        this.nextElementSibling.style.display='flex';
      ">


    <div class="fallback">

      <div class="em">

        ${item.emoji}

      </div>

      <b>

        ${item.fallback}

      </b>

    </div>

  </div>

  `;

}



/* =====================================================
   AUDIO
===================================================== */

function audioBlock(item) {

  return `

  <div class="audio-row">

    <button

      class="audio-btn"

      onclick="
        playAudio(
          '${item.slug}',
          'word'
        )
      ">

      🔊 Hear the Word

    </button>


    <button

      class="audio-btn"

      onclick="
        playAudio(
          '${item.slug}',
          'sentence'
        )
      ">

      🎧 Hear the Sentence

    </button>

  </div>


  <div

    id="audioStatus"

    class="audio-status">

    Fixed MP3 audio plays here
    after the files are uploaded.

  </div>

  `;

}



function playAudio(
  slug,
  type
) {

  stopAudio();


  const player =

    type === "word"

      ? wordAudio

      : sentenceAudio;


  player.src =

    "assets/audio/reading/day1/" +

    slug +

    "-" +

    type +

    ".mp3";


  player
    .play()

    .then(
      () => {

        setAudio(

          "🔊 Playing " +
          type +
          "..."

        );

      }
    )

    .catch(
      () => {

        setAudio(

          "⚠️ MP3 not uploaded yet."

        );

      }
    );

}



function setAudio(text) {

  const element =
    document.getElementById(
      "audioStatus"
    );


  if(element) {

    element.textContent =
      text;

  }

}



function stopAudio() {

  [
    wordAudio,
    sentenceAudio
  ]

  .forEach(

    audio => {

      audio.pause();

      audio.currentTime = 0;

    }

  );

}



wordAudio.onended =
  () => {

    setAudio(
      "👄 Now say the word yourself."
    );

  };


sentenceAudio.onended =
  () => {

    setAudio(
      "🧠 What did the sentence mean?"
    );

  };



/* =====================================================
   MULTIPLE CHOICE
===================================================== */

function optionsHTML(
  options,
  answer
) {

  return `

  <div class="options">

    ${
      options
        .map(

          (
            option,
            index
          ) => `

          <button

            class="option"

            onclick="
              answerMC(
                this,
                ${index},
                ${answer}
              )
            ">

            ${option}

          </button>

          `

        )
        .join("")
    }

  </div>


  <div
    id="feedback"
    class="feedback">
  </div>

  `;

}



function answerMC(
  button,
  index,
  answer
) {

  document
    .querySelectorAll(
      ".option"
    )

    .forEach(

      item => {

        item.classList.remove(
          "correct",
          "wrong"
        );

      }

    );


  const feedback =
    document.getElementById(
      "feedback"
    );


  if(
    index === answer
  ) {

    button
      .classList
      .add(
        "correct"
      );


    feedback.style.background =
      "#dff0e4";


    feedback.style.color =
      "#355c42";


    feedback.textContent =
      "✅ Correct.";


    state.score++;


    state.responses.push(
      1
    );


    feedback.style.display =
      "block";


    document.getElementById(
      "nextBtn"
    ).style.display =
      "block";


    disableOptions();

  }

  else {

    button
      .classList
      .add(
        "wrong"
      );


    feedback.style.background =
      "#fae7df";


    feedback.style.color =
      "#7c5145";


    feedback.textContent =

      "🌱 Try again. " +

      "Use the clues you still have.";


    state.responses.push(
      0
    );


    feedback.style.display =
      "block";

  }

}



function disableOptions() {

  document
    .querySelectorAll(
      ".option"
    )

    .forEach(

      button => {

        button.disabled =
          true;

      }

    );

}

  const percent =

  saveDay({

    score:

    total:
