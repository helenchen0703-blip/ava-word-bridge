<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Detective Writing Mission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6ee;
    --card:#ffffff;
    --ink:#3a3f3c;
    --muted:#8a9089;
    --border:#ece4d3;
    --mist:#7fa5c4;
    --mist-light:#e7eff6;
    --mist-dark:#4d7699;
    --sage:#8fae8f;
    --sage-light:#ecf3ea;
    --sage-dark:#5c7d5c;
    --lav:#a595c4;
    --lav-light:#f0ecf7;
    --lav-dark:#6e5b91;
    --peach:#e3a97e;
    --peach-light:#faeee0;
    --peach-dark:#a56a3b;
    --gold:#d9a441;
    --gold-glow:rgba(217,164,65,0.35);
    --shadow-sm: 0 2px 8px rgba(58,63,60,0.06);
    --shadow-md: 0 18px 46px rgba(45,40,30,0.16), 0 4px 14px rgba(58,63,60,0.08);
    --radius-lg: 26px;
    --radius-md: 16px;
    --font-display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --font-body:"Plus Jakarta Sans","Avenir Next","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --theater-1:#16261f;
    --theater-2:#1f352c;
    --marquee:#f0ca85;
    --marquee-deep:#c99a4f;
    --cream-text:#f4ecd8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 50% -8%, rgba(240,202,133,0.20), transparent 46%),
      radial-gradient(circle at 10% 85%, rgba(111,165,196,0.14), transparent 42%),
      radial-gradient(circle at 90% 90%, rgba(143,174,143,0.12), transparent 46%),
      linear-gradient(180deg, var(--theater-2) 0%, var(--theater-1) 70%);
    color:var(--cream-text);
    font-family:var(--font-body);
    line-height:1.6;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background:radial-gradient(ellipse at 50% 0%, transparent 45%, rgba(6,12,10,0.55) 100%);
  }
  .mote{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(1px);opacity:.5;animation:drift 14s ease-in-out infinite;}
  @keyframes drift{0%,100%{transform:translateY(0) translateX(0);}50%{transform:translateY(-18px) translateX(8px);}}
  .app-shell{max-width:800px;margin:0 auto;padding:0 22px 34px;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;}
  header{padding:26px 0 8px;}
  .stage-track{display:flex;gap:6px;align-items:center;margin-bottom:10px;}
  .stage-dot{flex:1;height:5px;border-radius:999px;background:rgba(244,236,216,0.16);transition:background .35s ease, box-shadow .35s ease;}
  .stage-dot.done{background:var(--sage);}
  .stage-dot.active{background:var(--marquee);box-shadow:0 0 12px var(--gold-glow);}
  .stage-label{text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.16em;color:var(--marquee);text-transform:uppercase;}
  main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding-top:22px;}
  .card{
    background:linear-gradient(150deg, #fffdf6 0%, #fbf3e2 100%);
    border:1px solid rgba(255,246,211,0.55);
    border-radius:var(--radius-lg);
    box-shadow:0 30px 70px rgba(6,16,13,0.45), 0 8px 20px rgba(6,16,13,0.25), 0 0 0 5px rgba(255,255,255,0.28) inset;
    padding:40px 40px 36px;
    width:100%;
    position:relative;
    animation:fadeIn .55s cubic-bezier(.16,.9,.2,1);
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(16px) scale(.98);filter:blur(5px);}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}}
  @keyframes pop{0%{transform:scale(.92);opacity:0;}65%{transform:scale(1.03);}100%{transform:scale(1);opacity:1;}}
  .pop{animation:pop .4s cubic-bezier(.2,.8,.2,1);}
  @keyframes softGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(127,165,196,0));}50%{filter:drop-shadow(0 0 10px rgba(127,165,196,.6));}}
  h1{font-family:var(--font-display);font-size:33px;text-align:center;margin:4px 0 8px;color:var(--ink);font-weight:600;letter-spacing:-.01em;}
  h2{font-family:var(--font-display);font-size:25px;margin:0 0 8px;color:var(--ink);font-weight:600;letter-spacing:-.005em;}
  .subhead{text-align:center;font-size:16px;color:var(--muted);margin:0 0 22px;}
  .lead{font-size:17px;color:var(--ink);text-align:center;margin:0 0 20px;}
  .pet-row{position:relative;display:flex;justify-content:center;gap:22px;margin:8px 0 20px;}
  .pet-row::before{
    content:"";
    position:absolute;
    top:-30px; left:50%; transform:translateX(-50%);
    width:280px; height:220px;
    background:radial-gradient(ellipse at center, var(--gold-glow), transparent 70%);
    z-index:0;
    pointer-events:none;
  }
  .pet-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .pet-wrap svg{border-radius:50%;background:radial-gradient(circle at 35% 30%, #fffaf0, #fbeed7);border:3px solid var(--marquee);box-shadow:0 6px 16px rgba(6,16,13,0.25), 0 0 0 1px rgba(255,255,255,0.5) inset;padding:5px;}
  .pet-wrap::after{
    content:"";
    display:block;
    width:52px; height:10px;
    margin-top:-6px;
    border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(58,63,60,0.16), transparent 75%);
  }
  .pet-name{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.03em;}
  .speech{
    position:relative;
    background:var(--mist-light);
    border:1.5px solid #d7e5ef;
    border-radius:18px;
    padding:14px 18px;
    font-size:16px;
    font-weight:600;
    color:var(--mist-dark);
    margin:0 0 18px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 6px 16px rgba(77,118,153,0.10);
  }
  .speech.cat{background:var(--lav-light);border-color:#e2d7ef;color:var(--lav-dark);}
  .speech.sage{background:var(--sage-light);border-color:#d6e6d3;color:var(--sage-dark);}
  .speech-pet{width:44px;height:44px;flex:none;}
  .prompt-box{background:var(--sage-light);border:1.5px solid #d6e6d3;border-radius:var(--radius-md);padding:22px 24px;margin-bottom:22px;}
  .prompt-label{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--sage-dark);margin-bottom:8px;}
  .prompt-text{font-size:19px;font-weight:700;color:var(--ink);margin:0;}
  .ask-line{font-size:20px;font-weight:700;color:var(--mist-dark);background:var(--mist-light);padding:15px 18px;border-radius:16px;text-align:center;margin:0 0 18px;}
  .center{text-align:center;}
  .btn{font-family:var(--font-body);font-size:16px;font-weight:700;padding:15px 28px;border-radius:16px;cursor:pointer;border:none;transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;box-shadow:var(--shadow-sm);}
  .btn:active{transform:scale(.97);}
  .btn-primary{
    background:linear-gradient(180deg, #f5d690 0%, var(--marquee) 45%, var(--marquee-deep) 100%);
    color:#4a3818;
    box-shadow:0 4px 0 #a97c3c, 0 12px 26px rgba(35,24,12,0.35), 0 1px 0 rgba(255,255,255,0.4) inset;
  }
  .btn-primary:hover{filter:brightness(1.04);box-shadow:0 4px 0 #a97c3c, 0 16px 30px rgba(35,24,12,0.4), 0 1px 0 rgba(255,255,255,0.4) inset;}
  .btn-primary:active{box-shadow:0 1px 0 #a97c3c, 0 4px 10px rgba(35,24,12,0.3), 0 1px 0 rgba(255,255,255,0.4) inset;}
  .btn-primary:disabled{background:#dfe3de;color:#a2a89f;cursor:not-allowed;box-shadow:none;}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--ink);}
  .btn-outline:hover{border-color:var(--mist);}
  .btn-ghost{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;box-shadow:none;padding:6px;}
  .btn-row{display:flex;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap;}
  .input-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
  textarea.answer-box{flex:1;min-height:72px;border:1.5px solid var(--border);border-radius:16px;padding:15px 17px;font-family:inherit;font-size:17px;resize:vertical;background:#fdfcf7;}
  textarea.answer-box:focus{outline:none;border-color:var(--mist);}
  .mic-btn{width:56px;height:56px;flex:none;border-radius:50%;border:1.5px solid var(--border);background:#fff;font-size:22px;cursor:pointer;box-shadow:var(--shadow-sm);}
  .mic-btn.listening{background:var(--peach-light);border-color:var(--peach);animation:pulseMic 1s infinite;}
  @keyframes pulseMic{0%{box-shadow:0 0 0 0 rgba(227,169,126,.55);}70%{box-shadow:0 0 0 14px rgba(227,169,126,0);}100%{box-shadow:0 0 0 0 rgba(227,169,126,0);}}
  .mic-hint{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:18px;}
  .objects-row{display:flex;gap:30px;justify-content:center;margin:6px 0 22px;}
  .object-card{width:118px;padding:14px 0;background:var(--lav-light);border:1.5px solid #e2d7ef;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  .object-card span{font-size:12.5px;color:var(--lav-dark);font-weight:700;}
  .reveal-card{background:var(--lav-light);border:1.5px solid #e2d7ef;border-radius:18px;padding:18px 20px;font-size:18px;font-weight:700;color:var(--lav-dark);text-align:center;margin-bottom:14px;}
  .choice-row{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
  .choice-btn{text-align:left;font-size:16px;font-weight:600;padding:16px 18px;border-radius:16px;border:1.5px solid var(--border);background:#fff;cursor:pointer;box-shadow:var(--shadow-sm);}
  .choice-btn:hover{border-color:var(--mist);}
  .choice-btn.correct{background:var(--sage-light);border-color:var(--sage);}
  .choice-btn.incorrect{background:var(--peach-light);border-color:#dba876;}
  .feedback-line{margin-top:14px;font-size:16px;font-weight:700;text-align:center;}
  .feedback-line.good{color:var(--sage-dark);}
  .feedback-line.retry{color:var(--lav-dark);}
  .action-card{background:#fdfcf7;border:1.5px solid var(--border);border-radius:20px;padding:26px 26px;margin-bottom:8px;}
  .action-word{display:inline-block;font-size:25px;font-weight:800;letter-spacing:.02em;color:var(--mist-dark);background:var(--mist-light);padding:9px 20px;border-radius:14px;margin-bottom:16px;}
  .hint-btn{display:block;margin:16px auto 0;background:none;border:none;color:var(--muted);font-size:13.5px;text-decoration:underline;cursor:pointer;}
  .hint-box{margin-top:12px;background:var(--peach-light);border:1px dashed var(--peach);border-radius:14px;padding:12px 16px;font-size:14.5px;color:var(--peach-dark);text-align:center;}
  .hint-box.level2{background:var(--lav-light);border-color:var(--lav);color:var(--lav-dark);}
  .hint-box.zh{background:var(--sage-light);border-color:var(--sage);color:var(--sage-dark);}
  .chip-pool{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin:8px 0 20px;}
  .idea-chip{background:var(--peach-light);border:1.5px solid var(--peach);border-radius:16px;padding:13px 17px;font-size:15px;font-weight:600;color:var(--peach-dark);cursor:grab;max-width:280px;box-shadow:var(--shadow-sm);}
  .idea-chip.selected{outline:3px solid var(--mist);}
  .idea-chip.placed{opacity:.32;cursor:default;}
  .rocket-wrap{display:flex;justify-content:center;margin:8px 0 6px;}
  .rocket-wrap svg{max-width:100%;height:auto;}
  .rocket-zone{cursor:pointer;transition:opacity .15s ease;}
  .rocket-zone:hover{opacity:.82;}
  .rocket-zone.filled{opacity:1;}
  .rocket-zone.cue{animation:softGlow 1.4s ease-in-out infinite;}
  .zone-caption{text-align:center;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .sparkle-msg{text-align:center;font-size:20px;font-weight:800;color:var(--sage-dark);margin:20px 0 4px;animation:pop .45s ease;}
  .celebrate-wrap{position:relative;display:flex;justify-content:center;margin-bottom:6px;}
  .twinkle{position:absolute;color:var(--gold,#e3c96a);font-size:20px;animation:twinkle 1.6s ease-in-out infinite;}
  .twinkle.t1{top:-6px;left:28%;animation-delay:0s;}
  .twinkle.t2{top:10px;right:26%;animation-delay:.35s;color:var(--lav);}
  .twinkle.t3{bottom:-4px;left:46%;animation-delay:.7s;color:var(--mist);}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}
  .footer-bar{padding:18px 0 4px;text-align:center;}
  .teacher-link{background:none;border:none;color:rgba(244,236,216,0.4);font-size:12px;cursor:pointer;text-decoration:underline;}
  .teacher-link:hover{color:rgba(244,236,216,0.7);}
  .modal{position:fixed;inset:0;background:rgba(58,63,60,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:200;}
  .modal.hidden{display:none;}
  .modal-card{background:#fff;border-radius:22px;max-width:660px;width:100%;padding:30px 32px 34px;box-shadow:var(--shadow-md);}
  .modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
  .tv-section{margin-bottom:20px;}
  .tv-section h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mist-dark);}
  .tv-item{background:#fdfcf7;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14px;}
  .tv-item b{color:var(--ink);}
  .axis-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:#fdfcf7;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;}
  .axis-name{font-weight:700;font-size:13px;color:var(--ink);min-width:130px;}
  .axis-text{font-size:13px;color:var(--muted);}
  .empty-note{font-size:13px;color:var(--muted);font-style:italic;}
  .mode-row{display:flex;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .mode-btn{font-size:13.5px;font-weight:700;padding:9px 16px;border-radius:12px;border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;}
  .mode-btn.active{background:var(--mist);border-color:var(--mist);color:#fff;}
  .frame-row{background:#fdfcf7;border:1.5px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:14px;}
  .frame-label{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px;}
  .frame-starter{font-size:14px;color:var(--muted);margin-bottom:6px;font-style:italic;}
  .highlight-phrase{background:#fff4c2;padding:1px 4px;border-radius:4px;}
  .trace-item{background:#fdfcf7;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13px;line-height:1.5;}
  .trace-rule{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px;color:var(--muted);}
  @media (max-width:640px){
    .card{padding:28px 22px 26px;}
    h1{font-size:24px;}
    .objects-row{gap:16px;}
    .object-card{width:96px;}
  }
</style>
</head>
<body>
<div class="mote" style="top:12%;left:8%;width:10px;height:10px;background:var(--gold);animation-delay:0s;"></div>
<div class="mote" style="top:68%;left:88%;width:7px;height:7px;background:var(--lav);animation-delay:3s;"></div>
<div class="mote" style="top:82%;left:14%;width:8px;height:8px;background:var(--sage);animation-delay:6s;"></div>
<div class="mote" style="top:22%;left:92%;width:6px;height:6px;background:var(--peach);animation-delay:9s;"></div>
<div class="app-shell">
  <header>
    <div class="stage-track" id="stageTrack"></div>
    <div class="stage-label" id="stageLabel">Authentic Task</div>
  </header>
  <main id="app"></main>
  <div class="footer-bar"><button class="teacher-link" onclick="openTeacherView()">Teacher View</button></div>
</div>

<div class="modal hidden" id="teacherModal">
  <div class="modal-card">
    <button class="modal-close" onclick="closeTeacherView()">✕</button>
    <h2 style="margin-top:0;">Teacher View</h2>
    <p style="font-size:13px;color:var(--muted);margin-top:-8px;">Based on one session. Evidence, not a diagnosis.</p>
    <div id="teacherContent"></div>
  </div>
</div>

<script src="bridge-storage.js"></script>
<script src="bridge-rules.js"></script>
<script src="bridge-agent.js"></script>
<script>
// ======================= Authentic content (verbatim, unedited) =======================
const PROMPT_TEXT = "Compare and contrast life in Ancient Athens and Ancient Sparta. Include details from both texts.";
const SAMPLE1 = "Life in Ancient Athens and Ancient Sparta was similar in some ways, but also very different. Both Athens and Sparta were Greek city-states, and both had enslaved people. However, Athens was a busy trading city where male citizens could help make decisions in the assembly. Boys in Athens learned reading, writing, math, music, poetry, and exercise because Athenians wanted them to be educated citizens. In Sparta, life focused more on the army. Spartan boys left home at age seven to train as soldiers, and Spartan men trained for many years. Women in Athens had fewer rights, but Spartan women had more rights, could own land, and did sports like running and gymnastics. Overall, Athens valued education, trade, and debate, while Sparta valued toughness, bravery, and military strength.";
const SAMPLE2 = "Athens and Sparta were both places in Ancient Greece. They were city-states and people lived there a long time ago. Athens was busy and had people trading. Boys learned things like reading and math. Sparta was different because boys had to train to be soldiers when they were young. They had to be tough. Women in Sparta could do more things that women in Athens. Athens and Sparta were kind of alike, but they also had different ways of living.";

// Idea chips for the rocket screen — real sentences lifted from Sample 1 (unedited).
const IDEA_CHIPS = [
  { id:'c1', text:'Both Athens and Sparta were Greek city-states.', correctZones:['nose'] },
  { id:'c2', text:'Boys in Athens learned reading, writing, math, music, poetry, and exercise.', correctZones:['body1','body2','body3'] },
  { id:'c3', text:'Overall, Athens valued education, trade, and debate, while Sparta valued toughness, bravery, and military strength.', correctZones:['tail'] }
];
// Evidence Detective — the "idea" is a verbatim sentence from Sample 1; all three choices are also verbatim.
const EVIDENCE_IDEA = "In Sparta, life focused more on the army.";
const EVIDENCE_CHOICES = [
  { id:'e1', text:'Spartan boys left home at age seven to train as soldiers.', isEvidence:true, phrase:'train as soldiers' },
  { id:'e2', text:'Boys in Athens learned reading, writing, math, music, poetry, and exercise.', isEvidence:false },
  { id:'e3', text:'Both Athens and Sparta were Greek city-states.', isEvidence:false }
];

// ======================= Pet mascots (inline SVG — no external images/network) =======================
function dogSVG(size){
  size = size || 56;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="dogFur" cx="38%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#f6dfb9"/><stop offset="100%" stop-color="#dba76a"/>
      </radialGradient>
      <linearGradient id="dogEar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c8934f"/><stop offset="100%" stop-color="#a97638"/>
      </linearGradient>
    </defs>
    <ellipse cx="21" cy="52" rx="11" ry="24" fill="url(#dogEar)" transform="rotate(-12 21 52)"/>
    <ellipse cx="79" cy="52" rx="11" ry="24" fill="url(#dogEar)" transform="rotate(12 79 52)"/>
    <circle cx="50" cy="53" r="31" fill="url(#dogFur)"/>
    <ellipse cx="35" cy="72" rx="6" ry="4" fill="#f6dfb9" opacity=".7"/>
    <ellipse cx="65" cy="72" rx="6" ry="4" fill="#f6dfb9" opacity=".7"/>
    <ellipse cx="50" cy="68" rx="15" ry="12" fill="#fdf6ea"/>
    <ellipse cx="39" cy="49" rx="4.3" ry="5.2" fill="#4a3626"/>
    <ellipse cx="61" cy="49" rx="4.3" ry="5.2" fill="#4a3626"/>
    <circle cx="40.3" cy="47" r="1.3" fill="#fff"/><circle cx="62.3" cy="47" r="1.3" fill="#fff"/>
    <ellipse cx="50" cy="63" rx="5.4" ry="4" fill="#3a2a1c"/>
    <path d="M50 66 L50 69" stroke="#3a2a1c" stroke-width="2" stroke-linecap="round"/>
    <path d="M40 72 Q50 78 60 72" stroke="#3a2a1c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function catSVG(size){
  size = size || 56;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="catFur" cx="38%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#efeaf3"/><stop offset="100%" stop-color="#c3b7d6"/>
      </radialGradient>
    </defs>
    <polygon points="22,44 30,12 46,42" fill="#a692c4"/>
    <polygon points="78,44 70,12 54,42" fill="#a692c4"/>

// ======================= Speech recognition helper =======================
function attachMic(micBtnId, textareaId){
  const micBtn = document.getElementById(micBtnId);
  if(!micBtn) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ micBtn.style.display = 'none'; return; }
  let recognizing = false, recognizer = null;
  micBtn.addEventListener('click', ()=>{
    const ta = document.getElementById(textareaId);
    if(recognizing){ recognizer && recognizer.stop(); return; }
    recognizer = new SR();
    recognizer.lang = 'en-US'; recognizer.interimResults = false; recognizer.maxAlternatives = 1;
    recognizer.onstart = ()=>{ recognizing = true; micBtn.classList.add('listening'); };
    recognizer.onend = ()=>{ recognizing = false; micBtn.classList.remove('listening'); };
    recognizer.onerror = ()=>{ recognizing = false; micBtn.classList.remove('listening'); };
    recognizer.onresult = (event)=>{
      const transcript = event.results[0][0].transcript;
      ta.value = (ta.value.trim() ? ta.value.trim() + ' ' : '') + transcript;
      ta.dispatchEvent(new Event('input'));
    };
    recognizer.start();
  });
}
function petSpeech(pet, text, cls){
  const svg = pet === 'dog' ? dogSVG(44) : catSVG(44);
  return `<div class="speech ${cls||''}"><div class="speech-pet">${svg}</div><div>${text}</div></div>`;
}

function sparklePath(cx, cy, r){
  const k = r * 0.28;
  return `M${cx},${cy-r} Q${cx+k},${cy-k} ${cx+r},${cy} Q${cx+k},${cy+k} ${cx},${cy+r} Q${cx-k},${cy+k} ${cx-r},${cy} Q${cx-k},${cy-k} ${cx},${cy-r} Z`;
}
function tspanWrap(text, cx, startY){
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  words.forEach(w=>{
    if((cur+' '+w).trim().length > 18){ lines.push(cur.trim()); cur = w; }
    else cur = (cur+' '+w).trim();
  });
  if(cur) lines.push(cur);
  return lines.slice(0,4).map((l,i)=>`<tspan x="${cx}" y="${startY + i*12}">${escapeHtml(l)}</tspan>`).join('');
}

function classifyComparisonConcept(){
  const cc = data.concept_check;
  const bothTested = cc.compare.correct !== null && cc.contrast.correct !== null;
  const s = data.same_response.trim(), d = data.different_response.trim();
  const freeTextOk = s.length>1 && d.length>1 && s.toLowerCase()!==d.toLowerCase();
  if(!bothTested && !freeTextOk) return 'Evidence remains inconclusive — neither the open response nor the interactive check was completed.';
  if(!bothTested) return freeTextOk ? 'Evidence weakens Comparison Concept as a barrier — she offered a similarity and a difference independently.' : 'Evidence remains inconclusive — one response was brief, missing, or unclear.';
  const firstTryBoth = cc.compare.attempts<=1 && cc.contrast.attempts<=1;
  if(firstTryBoth && freeTextOk) return 'Evidence weakens Comparison Concept as a barrier — she named a real similarity and difference, and matched COMPARE/CONTRAST to the right thinking action on the first try for both.';
  if(!firstTryBoth && freeTextOk) return 'Evidence is mixed — she could name a similarity and difference, but needed more than one try to match COMPARE or CONTRAST to the right thinking action.';
  if(firstTryBoth && !freeTextOk) return 'Evidence is mixed — she matched COMPARE and CONTRAST correctly, but her own similarity/difference responses were brief or unclear.';
  return 'Evidence supports Comparison Concept as a barrier — she needed more than one try to match both COMPARE and CONTRAST to the right thinking action.';
}
function classifyTaskLanguage(){
  const levels = S4_WORDS.map(w=>data[w.key].hintLevel);
  if(levels.every(l=>l===0)) return 'Evidence weakens Task Language as a barrier — all three action words were explained with no hints.';
  if(levels.every(l=>l>=2)) return 'Evidence supports Task Language as a barrier — every action word needed a meaning-level hint or more.';
  return 'Evidence remains inconclusive — some action words needed more support than others.';
}
function classifyEvidenceUse(){
  const ec = data.evidence_choice, ee = data.evidence_explanation;
  if(!ec.choice) return 'Evidence remains inconclusive — the evidence check was not completed.';
  if(ec.attempts<=1 && ee.hintLevel===0) return 'Evidence weakens Evidence Use as a barrier — she chose correctly on the first try and explained it without hints.';
  if(ec.attempts>1 && ee.hintLevel>=2) return 'Evidence supports Evidence Use as a barrier — she needed more than one try and a meaning-level hint to explain her choice.';
  return 'Evidence remains inconclusive — mixed results between choosing and explaining.';
}
function classifyOrganization(){
  const attempts = Object.values(data.rocket_organization.attempts||{});
  if(attempts.length < IDEA_CHIPS.length) return 'Evidence remains inconclusive — the rocket was not fully completed.';
  const total = attempts.reduce((a,b)=>a+b,0);
  if(total <= IDEA_CHIPS.length) return 'Evidence weakens Organization as a barrier — every idea was placed correctly on the first try.';
  if(total >= IDEA_CHIPS.length*2) return 'Evidence supports Organization as a barrier — several ideas needed more than one try to place.';
  return 'Evidence remains inconclusive — some ideas were placed quickly, others took more tries.';
}
function classifyIndependence(){
  const before = data.initial_task_interpretation.trim(), after = data.final_task_interpretation.trim();
  if(!before || !after) return 'Evidence remains inconclusive — one of the two task-understanding checks was not completed.';
  const keywordHit = /compare|contrast|same|different|evidence|detail/i.test(after) && !/compare|contrast|same|different|evidence|detail/i.test(before);
  const grew = after.length > before.length + 8 || keywordHit;
  if(grew) return 'Evidence weakens the idea that she still needs a lot of support — her explanation of the task became more complete after the mission.';
  return 'Evidence remains inconclusive — her before-and-after explanations look similar in depth.';
}
